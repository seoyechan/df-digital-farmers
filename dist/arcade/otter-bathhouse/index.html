<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
<title>수달 목욕탕 · DF 오락실</title>
<script src="/ga.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DotGothic16&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen bathhouse shift. Cream thermometer-style status strip, a mission strip, a fitted canvas bathhouse below; menu cards float over it. Single warm look on purpose. */
:root{
  --tile:#123a40;      /* page ground: deep bath tile */
  --cream:#fdf5e6;     /* panels: towel cream */
  --cream-2:#f4e7cf;
  --line:#dcc59e;
  --ink:#3a2a1c;
  --muted:#8b7357;
  --red:#e0473c;       /* ♨ sign red */
  --red-ink:#fff4ea;
  --teal:#2a9d92;
  --water:#57c3d3;
  --gold:#f0a63a;
  --scrim:rgba(10,32,36,.72);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --led:"DotGothic16",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--tile);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.hud{position:relative;display:flex;align-items:stretch;align-self:center;max-width:100%;height:50px;box-sizing:border-box;background:var(--cream);border:2px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}
.seg{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 12px;min-width:0;border-left:1px solid var(--line)}
.seg:first-child{border-left:0}
.seg-time{flex:0 0 auto;background:#20302f;align-items:flex-start}
.clock{font:22px/1 var(--led);font-variant-numeric:tabular-nums;color:#ff8b6b;text-shadow:0 0 9px rgba(255,120,90,.6)}
.dayrow{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1;white-space:nowrap;color:#c9d8d4}
.dayrow b{font-weight:700}
.badge{font:700 10px var(--body);border-radius:999px;padding:1px 6px;background:#33504d;color:#e6f4f1}
.badge.snow{background:#2b4f78;color:#dff0ff}.badge.wk{background:#8c3b3b;color:#ffe9e0}.badge.hol{background:#a3702a;color:#fff3dc}
.stat{flex:0 0 auto;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:0 18px}
.stat .meter{width:100px;flex:0 0 auto}
#hMoney{min-width:6.6em}
.stat .lbl{font-size:10px;line-height:1;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.stat .lbl em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0}
.stat b{font-size:17px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stars{color:#d9881a}.stars.low{color:var(--red)}
.meter{width:100%;height:7px;border-radius:4px;background:#ead9bb;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);transition:width .2s}
.seg-btns{flex:0 0 auto;flex-direction:row;align-items:center;gap:6px;padding:0 8px}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--cream-2);color:var(--ink);border-radius:9px;height:36px;width:36px;padding:0;font:600 16px var(--body);cursor:pointer}
.pz{display:inline-flex;gap:3px}.pz i{width:4px;height:12px;border-radius:2px;background:var(--ink)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(220,197,158,.6)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--water),var(--red))}
.mbar{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;flex-shrink:0;min-height:24px;overflow:hidden}
.chip{display:flex;align-items:center;gap:6px;min-width:0;background:rgba(253,245,230,.92);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:600 12px var(--body);white-space:nowrap}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip b{font-variant-numeric:tabular-nums;color:var(--teal)}
.chip.ok{background:var(--teal);border-color:var(--teal);color:#fff}.chip.ok b{color:#fff}
.chip.bad{background:#f7dcd6;border-color:#e9a99e;color:#8a2c22}.chip.bad b{color:#8a2c22}
/* narrow app width (phones held upright) */
  body.narrow .stat{flex:1 1 0;flex-direction:column;align-items:flex-start;gap:4px;padding:0 7px}
  body.narrow .stat .meter{width:100%}
  body.narrow #hMoney{min-width:0}
  body.narrow .stat .lbl em{display:none}
  body.narrow .hud{height:46px}body.narrow .seg{padding:0 7px}body.narrow .clock{font-size:18px}body.narrow .stat b{font-size:14px}body.narrow .stat .lbl{font-size:9px;letter-spacing:.02em}
  body.narrow .seg-btns{padding:0 4px;gap:4px}body.narrow .iconbtn{height:32px;width:32px;font-size:14px}
  body.narrow .dayrow .badge{padding:1px 4px}
  body.narrow .chip{font-size:10.5px;padding:3px 7px;gap:4px}
  body.narrow .toasts .rt:nth-child(n+2){display:none}
  body.narrow .alerts .al:nth-child(n+3){display:none}
  body.narrow .al{font-size:11.5px;padding:4px 9px}
  body.narrow .rt{font-size:11px;padding:4px 9px}
  body.narrow .hintline{font-size:11.5px}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:start center}
#app.mob #stage{flex:0 0 auto;order:2}
@media (max-width:480px){#app{padding-left:max(5px,env(safe-area-inset-left,0px));padding-right:max(5px,env(safe-area-inset-right,0px));padding-block:5px}#cv{border-radius:8px}}
/* sideways view: a portrait phone (or one with rotation lock) can play the wide layout turned 90° */
body.rot #app{position:fixed;top:0;transform:rotate(90deg);transform-origin:top left;padding-left:6px;padding-right:6px;padding-block:5px}
#bRot svg{display:block;margin:auto}
/* very short screens (a phone held or turned sideways): missions tuck away and alerts float over the bottom of the bathhouse */
#app{position:relative}
body.short .mbar{display:none}
body.short #msg{position:absolute;left:0;right:0;bottom:10px;z-index:4;pointer-events:none;padding-inline:12px}
/* short screens: one slim full-width bar on top, the bathhouse gets the rest */
body.short #app{gap:4px;padding-block:4px}
body.short .hud{height:38px;border-radius:10px}
body.short .seg{padding:0 10px}
body.short .stat{flex:1 1 0;justify-content:flex-start;padding:0 12px}
body.short .stat .meter{width:auto;flex:1 1 60px}
body.short .clock{font-size:17px}
body.short .dayrow{font-size:10px}
body.short .stat b{font-size:15px}
body.short .iconbtn{height:30px;width:30px;font-size:13px}
#app.mob #msg{order:3}
#app.mob .mbar{order:1}
#cv{display:block;touch-action:none;border-radius:12px;box-shadow:0 0 0 2px #0b2a2e,0 18px 40px rgba(0,0,0,.4)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--scrim);padding:10px;box-sizing:border-box;overflow:auto}
.card{margin:auto;flex-shrink:0;width:100%;max-width:460px;background:var(--cream);border:2px solid var(--line);border-radius:18px;padding:20px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.card>*{flex-shrink:0}
.sign{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;border-radius:14px;background:var(--red);color:var(--red-ink);box-shadow:inset 0 0 0 3px #fff3,inset 0 -6px 0 #0002}
.sign h1{margin:0;font:400 42px/1 var(--display);letter-spacing:.02em;text-wrap:balance;text-align:center;text-shadow:0 3px 0 #0003}
.sign h1 .onsen{display:inline-block;margin-right:8px;animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.sign h1 .onsen{animation:none}}
.sign .sub{font:13px var(--led);letter-spacing:.2em;opacity:.9}
.sign canvas{width:64px;height:64px}
.tagline{margin:0;color:var(--muted);font-size:14px;line-height:1.6;text-align:center;text-wrap:balance}
.how{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:center;font-size:13.5px}
.how kbd{font:400 15px var(--display);color:#fff;background:var(--teal);border-radius:7px;padding:4px 0;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:11px;padding:12px 16px;font:400 18px var(--display);cursor:pointer;flex:1;min-width:120px}
.btn.primary{background:var(--red);color:var(--red-ink);box-shadow:inset 0 -4px 0 #0003}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font:600 15px var(--body)}
.btn.ad{display:flex;align-items:center;justify-content:center;gap:8px;background:#e7f4f1;color:var(--ink);border:1.5px dashed var(--teal);font:600 15px var(--body)}
.btn.ad b{color:var(--red)}
.vid{display:inline-grid;place-items:center;width:22px;height:16px;border-radius:4px;background:var(--teal);color:#fff;font-size:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.grade{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cream-2);border-radius:12px;padding:10px 12px}
.grade span{font-size:12px;color:var(--muted)}
.grade b{font:400 18px var(--display);color:var(--teal)}
.grade i{font-style:normal;color:var(--gold);letter-spacing:2px}
h2{margin:0;font:400 28px/1.1 var(--display);color:var(--red);text-wrap:balance}
h3.sec{margin:2px 0 -4px;font:400 15px var(--display);color:var(--teal);letter-spacing:.03em}
.lines{display:grid;gap:5px;margin:0}
.lines div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.lines dt{color:var(--muted)}
.lines dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.lines .total{border-top:1.5px solid var(--line);padding-top:8px;margin-top:4px;font-size:17px}
.lines .total dd{color:var(--red)}
.lines dd.neg{color:#b5452f}
.mis{display:grid;gap:6px}
.mis div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--cream-2)}
.mis div.ok{background:#dcefeb}.mis div.ok b{color:var(--teal)}
.mis div b{font-variant-numeric:tabular-nums;color:var(--muted)}
.note{font-size:11px;color:var(--muted);text-align:center;margin:-6px 0 0}
.upgrades{display:grid;gap:9px}
.up{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--cream-2);border:1px solid var(--line)}
.up h4{margin:0;font-size:15px}
.up p{margin:0;font-size:12px;color:var(--muted);grid-column:1;line-height:1.45}
.pips{display:flex;gap:4px;grid-column:1}
.pips i{width:16px;height:5px;border-radius:3px;background:#e2cfac}
.pips i.on{background:var(--teal)}
.up .btn{grid-row:1/span 3;grid-column:2;min-width:100px;font:600 13px var(--body);padding:10px}
.repwhy{display:grid;gap:6px;background:var(--cream-2);border-radius:12px;padding:10px 12px;font-size:13px}
.repwhy h4{margin:0 0 2px;font:400 15px var(--display);color:var(--red)}
.repwhy div{display:flex;justify-content:space-between;gap:10px}
.repwhy b{color:var(--red);font-variant-numeric:tabular-nums}
.repwhy p{margin:0;color:var(--muted)}
.repwhy p.early{color:var(--ink);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px}
.msg{flex-shrink:0;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.hintline{max-width:100%;box-sizing:border-box;background:var(--gold);color:#3a2306;font-weight:700;font-size:12.5px;line-height:1.3;padding:4px 14px;border-radius:14px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hint:not([hidden]) ~ *{display:none!important}
.alerts{display:flex;gap:6px;min-width:0;overflow:hidden}
.al{display:flex;align-items:center;gap:5px;flex-shrink:0;border-radius:999px;padding:5px 11px;font:700 12.5px var(--body);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.al.hot{background:var(--red);color:#fff;animation:alPulse .8s ease-in-out infinite}
.al.warm{background:var(--gold);color:#3a2306}
.al i{font-style:normal;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#fff3;font-size:11px}
@keyframes alPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.alerts:empty{display:none}
.alerts:not(:empty) ~ .toasts{display:none}
.alerts .al:nth-child(n+5){display:none}
.seg.stat.repwarn{background:#fbe0db;animation:segPulse .8s ease-in-out infinite}
.seg.stat.repwarn .lbl{color:var(--red);font-weight:700}
@keyframes segPulse{0%,100%{background:#fbe0db}50%{background:#f6b8ad}}
.toasts{display:flex;gap:6px;min-width:0;overflow:hidden}
.rt{display:flex;flex-shrink:0;align-items:center;gap:6px;background:rgba(253,245,230,.96);border:1.5px solid var(--red);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12px var(--body);box-shadow:0 6px 16px rgba(0,0,0,.3);animation:rtIn .25s ease-out;white-space:nowrap}
.rt b{color:var(--red);font-variant-numeric:tabular-nums}
.rt.pos{border-color:var(--teal)}.rt.pos b{color:var(--teal)}
.rt.out{opacity:0;transform:translateX(-10px);transition:opacity .35s,transform .35s}
@keyframes rtIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.stars.hit{animation:repHit .5s}
@keyframes repHit{0%,100%{transform:none}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
.danger{position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 0 6px rgba(224,71,60,.95),inset 0 0 60px 18px rgba(224,71,60,.5);animation:dangerPulse .7s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{opacity:1}50%{opacity:.25}}
.rt.dangerchip{background:var(--red);border-color:var(--red);color:#fff;white-space:normal;line-height:1.3;max-width:100%}
@media (prefers-reduced-motion:reduce){.rt,.stars.hit,.danger,.al.hot,.seg.stat.repwarn{animation:none}}
/* goal + ending */
.goal{display:grid;gap:6px;background:#20302f;color:#e6f4f1;border-radius:12px;padding:11px 12px}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.goal .gt b{font:400 16px var(--display);color:#ffd36b;letter-spacing:.02em}
.goal .gt span{font-variant-numeric:tabular-nums;color:#c9ddd9;white-space:nowrap}
.goal .bar{height:9px;border-radius:5px;background:#33504d;overflow:hidden}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:5px}
.goal.done b{color:#9ff0d8}
.up.goalup{background:#20302f;border-color:#20302f;color:#fff4ea}
.up.goalup h4{font:400 18px var(--display);color:#ffd36b}
.up.goalup p{color:#c9ddd9}
.up.goalup .bar{grid-column:1;height:7px;border-radius:4px;background:#33504d;overflow:hidden}
.up.goalup .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red))}
.up.goalup .btn{background:#ffd36b;color:#3a2306;box-shadow:inset 0 -4px 0 #0002}
.ending{position:fixed;inset:0;z-index:60;background:#0b1f22;overflow:hidden;color:#fff4ea}
.ending canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ending .shade{position:absolute;inset:0;background:linear-gradient(rgba(8,20,22,.15),rgba(8,20,22,.82) 55%);opacity:0;transition:opacity 1.6s}
.ending.rolling .shade{opacity:1}
.ending .headline{position:absolute;left:0;right:0;top:calc(10% + env(safe-area-inset-top,0px));text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;transition:opacity 1s}
.ending .headline h2{color:#ffd36b;font-size:clamp(28px,6vw,48px);text-shadow:0 3px 0 #0006}
.ending .headline p{margin:8px 0 0;font-size:15px;color:#fff4ea;text-shadow:0 2px 0 #0006}
.ending.rolling .headline{opacity:0}
.credits{position:absolute;left:0;right:0;top:100%;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:4px;justify-items:center}
.ending.rolling .credits{animation:roll var(--dur,40s) linear forwards}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(calc(-100% - 100vh))}}
.credits h3{margin:34px 0 8px;font:400 14px var(--led);letter-spacing:.24em;color:#9fc3bd}
.credits .big{font:400 clamp(30px,7vw,52px)/1.1 var(--display);color:#ffd36b;margin-top:10px}
.credits .role{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;width:min(100%,420px);font-size:15px;align-items:baseline}
.credits .role span:first-child{text-align:right;color:#c9ddd9}
.credits .role span:last-child{text-align:left;font-weight:700}
.credits .role i{font-style:normal;color:#56807b}
.credits .stat{font-size:15px}.credits .stat b{color:#ffd36b;font-variant-numeric:tabular-nums}
.credits .note{max-width:34ch;color:#c9ddd9;font-size:15px;line-height:1.7;text-wrap:balance}
.ending .endbtns{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ending .endbtns .btn{flex:0 1 220px}
.ending .skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));appearance:none;border:1px solid #ffffff40;background:#0006;color:#fff4ea;border-radius:999px;padding:6px 14px;font:600 13px var(--body);cursor:pointer}
@media (prefers-reduced-motion:reduce){.ending.rolling .credits{animation:none;top:auto;bottom:90px;max-height:70vh;overflow:auto}}
.adplay{position:absolute;inset:0;display:grid;place-items:center;background:#08191b;color:#9fc3bd;font:22px var(--led);text-align:center;z-index:5}
</style>

</head><body>
<div class="danger" id="danger" hidden aria-hidden="true"></div>
<div id="app">
  <div class="hud" id="hud">
    <div class="seg seg-time">
      <div class="clock" id="clock">06:00</div>
      <div class="dayrow"><b id="hDay">Day 1</b><span class="badge snow" id="bSnow" hidden>❄</span><span class="badge wk" id="bWk" hidden></span><span class="badge hol" id="bHol" hidden></span></div>
    </div>
    <div class="seg stat"><span class="lbl" data-i18n="hudMoney"></span><b id="hMoney">₩0</b></div>
    <div class="seg stat"><span class="lbl"><span data-i18n="hudClean"></span> <em id="hCleanN">100%</em></span><div class="meter"><i id="hClean" style="width:100%"></i></div></div>
    <div class="seg stat" id="segRep"><span class="lbl" id="repLbl" data-i18n="hudRep"></span><b id="hRep" class="stars">★5.00</b></div>
    <div class="seg seg-btns">
      <button class="iconbtn" id="bRot" aria-label="rotate" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" transform="rotate(-90 12 12)"/><path d="M3 9a9 9 0 0 1 9-6"/><path d="M12 1l1 2-2 1"/></svg></button>
      <button class="iconbtn" id="bSound" aria-label="sound">♪</button>
      <button class="iconbtn" id="bPause" aria-label="pause"><span class="pz"><i></i><i></i></span></button>
    </div>
    <div class="prog" aria-hidden="true"><i id="hProg"></i></div>
  </div>
  <div class="mbar" id="mbar" aria-live="polite"></div>

  it.el.innerHTML=`<b>★${it.d>0?'+':'−'}${Math.abs(it.d).toFixed(2)}</b><span>${t('r_'+key)}</span>`;
  clearTimeout(it.timer);it.timer=setTimeout(()=>{it.el.classList.add('out');setTimeout(()=>it.el.remove(),380);},2600);
  if(delta<0){const r=$('#hRep');r.classList.remove('hit');void r.offsetWidth;r.classList.add('hit');}
}

/* =========================================================
   CUSTOMERS
   Men's bath flow: walk in free → locker (undress) → bath hall: tubs / sauna / scrub
   → back out to the locker room: towel → dryer (dress) → used-towel bin → (massage) → (snack) → pay at the desk → leave
   ========================================================= */
function makePlan(kid){return ['shower'].concat(makePlan0(kid));}
function makePlan0(kid){
  const d=save.day,extra=[];
  if(kid&&save.up.cold) return Math.random()<.5?['warm','cold']:['cold','warm','cold'];
  if(Math.random()<.55) extra.push('hot');
  if(save.up.cold&&Math.random()<.5) extra.push('cold');
  if(save.up.sauna&&Math.random()<.5) extra.push('sauna');
  shuffle(extra);
  const plan=['warm'].concat(extra).slice(0,3);
  const sp=kid?.04:(d===1?.22:.3+Math.min(.1,d*.01));
  if(Math.random()<sp) plan.splice(1,0,'scrub');
  return plan;
}
function spawnCustomer(){
  const kid=Math.random()<(save.up.cold?.16:.1), plan=makePlan(kid);
  const avail=SNACKS.filter(snackOn);
  let snack=null;
  if(Math.random()<(kid?.8:.45)){snack=(plan.includes('sauna')&&snackOn('egg')&&Math.random()<.55)?'egg':pick(avail);}
  G.customers.push({x:L.door.x+rand(-18,18),y:L.H+30,state:'enter',plan,pi:0,act:null,slot:-1,seat:-1,timer:0,patience:100,checks:0,
    wrap:false,yang:false,towel:false,snack,kid,wantMassage:!!save.up.massage&&!kid&&Math.random()<.35,massaged:false,
    doze:false,dozeT:0,dozeAt:-1,warned:false,off:rand(-22,22),hit:new Set(),step:Math.random()*6,moving:false,v:randVariant(kid),wet:G.snow});
  sfx.bell();
}
function segHits(ax,ay,bx,by,r){
  let t0=0,t1=1;const dx=bx-ax,dy=by-ay;
  const p=[-dx,dx,-dy,dy],q=[ax-r.x,r.x+r.w-ax,ay-r.y,r.y+r.h-ay];
  for(let i=0;i<4;i++){
    if(p[i]===0){if(q[i]<0)return false;}
    else{const tt=q[i]/p[i];if(p[i]<0){if(tt>t1)return false;if(tt>t0)t0=tt;}else{if(tt<t0)return false;if(tt<t1)t1=tt;}}
  }
  return t1-t0>1e-3?t0:false;
}
const PAD=20;
function blocker(ax,ay,bx,by){
  let hit=null,ht=2;
  for(const r of obstacles()){
    const R={x:r.x-PAD,y:r.y-PAD,w:r.w+PAD*2,h:r.h+PAD*2};
    const tt=segHits(ax,ay,bx,by,{x:R.x+2,y:R.y+2,w:R.w-4,h:R.h-4});
    if(tt!==false&&tt<ht){ht=tt;hit=R;}
  }
  return hit;
}
const zoneOf=(x,y)=>L.split.axis==='x'?(x<L.split.at?'hall':'room'):(y<L.split.at?'hall':'room');
/* walking between the bath hall and the locker room always goes through the glass door */
function walk(c,tx,ty,dt,spd=105){
  if(c.crossTo){const b=L.hallDoor[c.crossTo];if(moveTo(c,b.x,b.y,dt,spd))c.crossTo=null;return false;}
  const zc=zoneOf(c.x,c.y),zt=zoneOf(tx,ty);
  if(zc!==zt){const a=L.hallDoor[zc];if(walkIn(c,a.x,a.y,dt,spd)){c.crossTo=zt;c.wp=null;}return false;}
  return walkIn(c,tx,ty,dt,spd);
}
function walkIn(c,tx,ty,dt,spd){
  const wk=Math.round(tx)+','+Math.round(ty);if(c.wtKey!==wk){c.wtKey=wk;c.wtT=0;}c.wtT+=dt;
  if(c.wtT>6){c.wp=null;return moveTo(c,tx,ty,dt,spd);}
  if(c.wp){if(moveTo(c,c.wp.x,c.wp.y,dt,spd))c.wp=null;return false;}
  const R=blocker(c.x,c.y,tx,ty);
  if(R){
    const cs=[{x:R.x,y:R.y},{x:R.x+R.w,y:R.y},{x:R.x,y:R.y+R.h},{x:R.x+R.w,y:R.y+R.h}];
    const len=k=>Math.hypot(k.x-c.x,k.y-c.y)+Math.hypot(tx-k.x,ty-k.y);
    let best=null,bl=1e9;
    const inRoom=k=>k.x>26&&k.x<L.W-26&&k.y>44&&k.y<L.H-20;
    for(const k of cs){if(!inRoom(k)||zoneOf(k.x,k.y)!==zoneOf(c.x,c.y))continue;if(blocker(c.x,c.y,k.x,k.y)||blocker(k.x,k.y,tx,ty))continue;if(len(k)<bl){bl=len(k);best=k;}}
    if(!best)for(const k of cs){if(!inRoom(k)||zoneOf(k.x,k.y)!==zoneOf(c.x,c.y))continue;if(blocker(c.x,c.y,k.x,k.y))continue;if(len(k)<bl){bl=len(k);best=k;}}
    if(best){c.wp=best;return false;}
  }
  return moveTo(c,tx,ty,dt,spd);
}
function moveTo(c,tx,ty,dt,spd=105){
  const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
  if(d<3){c.x=tx;c.y=ty;c.moving=false;return true;}
  const s=Math.min(d,spd*dt);c.x+=dx/d*s;c.y+=dy/d*s;c.step+=dt*8;c.moving=true;return false;
}
const tubById=id=>L.tubs.find(x=>x.id===id);
const WATER=a=>a==='warm'||a==='hot'||a==='cold';
const IN_FAC=c=>(c.state==='into'||c.state==='do'||c.state==='outAct')&&!!c.act;
/* 0 = standing on the tub floor edge, 1 = sunk to the shoulders */
function sinkOf(c){
  if(c.state==='into'){const pl=actPlace(c);return .5*Math.max(0,1-dist(c,pl.slot)/(c.intoD||1));}
  if(c.state==='do') return .5+.5*Math.min(1,(c.doT||0)/.6);
  if(c.state==='outAct'){if((c.riseT||0)<.45)return 1-.5*(c.riseT||0)/.45;const pl=actPlace(c);return .5*Math.min(1,dist(c,pl.entry)/(c.outD||1));}
  return 0;
}
function actPlace(c){
  const a=c.act;
  if(a==='warm'||a==='hot'||a==='cold'){const tb=tubById(a);return{entry:tb.entry,slot:{x:tb.x+tb.w*(c.slot+.5)/tb.n,y:tb.y+tb.h*.56}};}
  if(a==='sauna'){const s=L.sauna;return{entry:s.entry,slot:{x:s.x+s.w*(c.slot+.5)/s.n,y:s.y+s.h*.6}};}
  if(a==='shower'){const sh=L.shower,st=sh.seats[Math.max(0,c.slot)],o=22*st.side;return{entry:sh.axis==='h'?{x:st.x,y:st.y+o}:{x:st.x+o,y:st.y},slot:{x:st.x,y:st.y}};}
  if(a==='scrub'){const b=c.bed.b;return{entry:b.app,slot:{x:b.x+b.w/2,y:b.y+b.h/2}};}
  if(a==='massage'){const m=L.massage;return{entry:m.app,slot:{x:m.x+m.w/2,y:m.y+m.h*.46}};}
}
function reserve(c){
  const a=c.act;
  if(a==='warm'||a==='hot'||a==='cold'){const occ=G.tubs[a].occ;const free=[];occ.forEach((o,i)=>{if(!o)free.push(i);});if(!free.length)return false;c.slot=pick(free);occ[c.slot]=c;return true;}
  if(a==='shower'){const occ=G.shower.occ;const free=[];occ.forEach((o,i)=>{if(!o)free.push(i);});if(!free.length)return false;c.slot=pick(free);occ[c.slot]=c;return true;}
  if(a==='sauna'){const occ=G.sauna.occ;const free=[];occ.forEach((o,i)=>{if(!o)free.push(i);});if(!free.length)return false;c.slot=pick(free);occ[c.slot]=c;return true;}
  if(a==='scrub'){const b=G.beds.find(b=>!b.occ&&!isLocked(b.b));if(!b)return false;b.occ=c;c.bed=b;return true;}
  if(a==='massage'){if(G.massage.occ)return false;G.massage.occ=c;return true;}
  return false;
}
function releaseAct(c){
  const a=c.act;
  if(a==='warm'||a==='hot'||a==='cold'){const occ=G.tubs[a].occ;if(occ[c.slot]===c)occ[c.slot]=null;}
  else if(a==='sauna'){if(G.sauna.occ[c.slot]===c)G.sauna.occ[c.slot]=null;}
  else if(a==='shower'){if(G.shower.occ[c.slot]===c)G.shower.occ[c.slot]=null;}
  else if(a==='scrub'&&c.bed){if(c.bed.occ===c){c.bed.occ=null;c.bed.spots=[];}c.bed=null;}
  else if(a==='massage'){if(G.massage.occ===c)G.massage.occ=null;}
  c.slot=-1;
}
const seatPos=i=>({x:L.vanity.x+L.vanity.w*(i+.5)/L.vanity.n,y:L.vanity.y+L.vanity.h+26});
function reserveSeat(c){const free=[];G.dryer.forEach((o,i)=>{if(!o)free.push(i);});if(!free.length)return false;c.seat=pick(free);G.dryer[c.seat]=c;return true;}
function releaseSeat(c){if(c.seat>=0&&G.dryer[c.seat]===c)G.dryer[c.seat]=null;c.seat=-1;}
function nextAct(c){
  while(c.pi<c.plan.length&&isLocked(c.plan[c.pi]==='sauna'?L.sauna:c.plan[c.pi]==='cold'?tubById('cold'):null)) c.pi++;
  if(c.pi>=c.plan.length){c.act=null;c.state='toTowel';return;}
  c.act=c.plan[c.pi];c.doze=false;c.warned=false;
  if(reserve(c)) c.state='toAct';
  else if(c.act==='scrub'){
    // a long scrub line puts people off: they skip the scrub instead of waiting forever
    const beds=G.beds.filter(b=>!isLocked(b.b)).length;
    if(G.bq.length>=beds+1){c.pi++;nextAct(c);return;}
    c.state='waitBed';
  }
  else {c.state='waitAct';c.timer=c.act==='shower'?2.5:4.5;}
}
function afterMassage(c){c.act=null;c.massaged=true;c.state=c.snack?'toSnack':'toPay';}
function afterBasket(c){
  if(c.wantMassage&&!c.massaged&&!isLocked(L.massage)){c.act='massage';if(reserve(c))c.state='toAct';else{c.state='waitAct';c.timer=5;}return;}
  afterMassage(c);
}
function finishAct(c){
  if(c.act==='massage'){releaseAct(c);afterMassage(c);return;}
  releaseAct(c);c.pi++;nextAct(c);
}
function startDo(c){
  c.state='do';
  const a=c.act;
  if(a==='scrub'){c.bed.spots=genSpots();hint('hintScrub');}
  else if(a==='massage'){c.timer=5;}
  else if(a==='shower'){c.timer=c.tMax=rand(3.6,5);}
  else {c.timer=a==='sauna'?rand(6.5,8):(c.kid&&a==='cold')?rand(8,10):rand(5,7);
    if(save.day>=2&&(a==='hot'||a==='sauna')&&Math.random()<.2){c.dozeAt=c.timer*.55;}else c.dozeAt=-1;
  }
}
function genSpots(){const s=[];const n=6+((Math.random()*3)|0);for(let i=0;i<n;i++)s.push({x:rand(-10,6),y:rand(-8,8),r:rand(3.5,5.5),hp:100,rot:Math.random()*6});return s;}
function angerWhy(c){
  if(c.slipT&&now-c.slipT<3)return 'slip';
  switch(c.state){
    case 'squeue':case 'snackWait':case 'toSnack':return 'snack';
    case 'waitTowel':return 'towel';
    case 'waitDry':return 'dry';
    case 'waitBed':return 'bed';
    case 'queue':case 'counter':case 'toPay':return 'pay';
    case 'waitAct':return c.act==='massage'?'massage':'full';
    case 'do':
      if(c.act==='scrub')return 'scrub';
      if(c.act==='sauna')return 'sauna';
      if(WATER(c.act)){const cf=tubComfort(c.act);if(cf<0)return 'cold';if(cf>0)return 'hot';}
      return 'wait';
  }
  return 'wait';
}
function goAngry(c){
  releaseAct(c);releaseSeat(c);
  let i=G.queue.indexOf(c);if(i>=0)G.queue.splice(i,1);
  i=G.squeue.indexOf(c);if(i>=0)G.squeue.splice(i,1);
  i=G.bq.indexOf(c);if(i>=0)G.bq.splice(i,1);
  const why=angerWhy(c);
  c.state='angry';c.doze=false;G.lost++;repHit(-.4,'angry_'+why);
  float(c.x,c.y-56,t('say_'+why),'#ff8a7a',13,true,2.8);sfx.angry();
}
function finishVisit(c){
  const tip=Math.round(c.patience/100*1200*cleanMult()/100)*100;
  G.tips+=tip;if(c.patience>60)repHit(.1,'happy');
  if(tip>0)setTimeout(()=>G&&float(c.x,c.y-38,t('tip')+' +'+won(tip),'#ffd36b',13,true),220);
  c.happy=c.patience>45;c.state='leave';
}
function checkout(){
  const c=G.queue[0];
  if(!c||c.state!=='counter') return;
  c.checks++;flash=.12;sfx.check();
  burst(L.counter.x+40,L.counter.y+30,'#ffb04a',4,50);
  if(c.checks>=checkNeed()){
    let fee=PRICE.entry+(c.plan.includes('sauna')&&save.up.sauna?PRICE.sauna:0)+(G.weekend?1000:0)+(G.holiday?2000:0);
    if(c.kid) fee=Math.round(fee/2);
    G.inc.entry+=fee;G.served++;
    float(c.x,c.y-58,won(fee),'#ffffff',15,true);burst(c.x,c.y-20,'#ffcf4a',10,90,'coin');sfx.coin();
    float(c.x,c.y-82,t('checkTap'),'#ffe9a8',11);

  }
}
function serveSnack(id){
  const c=G.squeue[0];
  if(!snackOn(id)){float(L.snack.x+L.snack.w/2,L.snack.y-10,t('locked'),'#ffd36b',12,true);return;}
  if(!c||c.state!=='snackWait'){tone(500,.05,'triangle',.03);return;}
  if(id!==c.snack){c.patience-=15;repHit(-.08,'wrong');float(c.x,c.y-60,t('wrongItem'),'#ff8a7a',13,true);sfx.wrong();return;}
  const p=PRICE[id];G.inc.snack+=p;G.snacks++;
  float(c.x,c.y-60,won(p),'#ffffff',14,true);burst(c.x,c.y-30,'#ffcf4a',8,80,'coin');sfx.coin();
  G.squeue.shift();c.snack=null;c.drink=id;c.state='toPay';
}
function takeTowel(c){
  if(G.towels<=0) return false;
  G.towels--;G.pop=.25;c.towel=true;sfx.towel();if(G.towels<=2)hint('hintTowel');
  c.state=reserveSeat(c)?'toDry':'waitDry';
  return true;
}
function dropLost(x,y){
  if(G.lostItems.length>=3) return;
  for(let k=0;k<10&&!validFloor(x,y);k++){x=rand(L.floor.x,L.floor.x+L.floor.w);y=rand(L.floor.y,L.floor.y+L.floor.h);}
  if(!validFloor(x,y)) return;
  G.lostItems.push({x,y,kind:pick(LOST_KINDS),t:0});hint('hintLost');
}
const SLIP_STATES=['toLocker','toQueue','toPay','queue','toAct','toBasket','toSnack','squeue','outAct','waitAct','waitBed','toTowel','waitTowel','toDry','waitDry'];
function updateCustomer(c,dt){
  const dayMult=Math.min(1.9,.85+.075*(save.day-1))*(save.up.radio?.8:1);
  let drain=0;
  switch(c.state){
    case 'enter': if(walk(c,L.door.x+c.off*.5,L.H-58,dt))c.state='toLocker';
      if(c.wet&&Math.random()<dt*1.2){const dd=addDirt(c.x+rand(-8,8),c.y+12,'slush');if(dd)c.hit.add(dd);} break;
    case 'toLocker':{const f=L.lockers.front;drain=.4;if(walk(c,f.x+c.off,f.y,dt)){c.state='undress';c.timer=.7;}break;}
    case 'undress': c.timer-=dt;if(c.timer<=0){c.wrap=true;nextAct(c);} break;
    case 'waitAct':{const pl=actPlace({...c,slot:0,act:c.act,bed:G.beds[0]});drain=2;
      walk(c,pl.entry.x+c.off,pl.entry.y+16,dt);
      if(reserve(c)){c.state='toAct';break;}
      c.timer-=dt;if(c.timer<=0){
        if(c.act==='massage'){afterMassage(c);break;}
        if(c.act==='shower'){c.pi++;nextAct(c);break;}
        float(c.x,c.y-50,t('tubFull'),'#cfe6ff',12,true);repHit(-.02,'full');c.pi++;nextAct(c);} break;}
    case 'waitBed':{drain=1.5;if(!G.bq.includes(c))G.bq.push(c);const i=G.bq.indexOf(c),p=L.bqueue(i);walk(c,p.x,p.y,dt);
      if(i===0&&reserve(c)){G.bq.shift();c.state='toAct';} break;}
    case 'toAct':{const pl=actPlace(c);drain=.6;if(walk(c,pl.entry.x,pl.entry.y,dt)){c.state='into';c.intoD=Math.max(1,dist(c,pl.slot));c.riseT=0;c.outD=0;c.rx=null;c.swimBack=false;if(WATER(c.act))setTimeout(()=>sfx.plunge(),250);}break;}
    case 'into':{const pl=actPlace(c);if(moveTo(c,pl.slot.x,pl.slot.y,dt,WATER(c.act)?70:90)){c.doT=0;startDo(c);}break;}
    case 'do': c.doT=(c.doT||0)+dt; if(isSwimmer(c))stepSwim(c,dt); drain=doAct(c,dt); break;
    case 'outAct':{const pl=actPlace(c);
      if(isSwimmer(c)&&c.rx!=null&&Math.abs(c.rx-c.x)>1.5){c.swimBack=true;stepSwim(c,dt);break;}
      if(c.swimBack){c.swimBack=false;c.rx=null;}
      if(WATER(c.act)&&c.riseT<.45){c.riseT+=dt;c.moving=false;break;}
      if(!c.outD){c.outD=Math.max(1,dist(c,pl.entry));if(WATER(c.act))sfx.dripOut();else if(c.act==='shower')sfx.bowl();}
      if(moveTo(c,pl.entry.x,pl.entry.y,dt,WATER(c.act)?75:95)){
        if(c.act!=='massage'){
          if(Math.random()<.3){const dd=addDirt(c.x+rand(-14,14),c.y+rand(10,26),c.act==='scrub'?'foam':'water');if(dd)c.hit.add(dd);}
          if(Math.random()<.07)dropLost(c.x+rand(-30,30),c.y+rand(16,40));
        }
        finishAct(c);} break;}
    case 'toTowel':{const f=L.shelf.front;drain=.5;
      if(walk(c,f.x+c.off*.3,f.y+c.off*.7,dt)){if(!takeTowel(c)){c.state='waitTowel';float(c.x,c.y-50,t('noTowel'),'#ff8a7a',12,true);hint('hintTowel',true);}}
      break;}
    case 'waitTowel': drain=4.5; takeTowel(c); break;
    case 'waitDry':{drain=2;const p=seatPos(1);walk(c,p.x+c.off*1.6,p.y+46,dt);if(reserveSeat(c))c.state='toDry';break;}
    case 'toDry':{const p=seatPos(c.seat);if(walk(c,p.x,p.y,dt)){c.state='dry';c.timer=dryTime();hint('hintDry');}break;}
    case 'dry':{c.timer-=dt;c.moving=false;c.patience=Math.min(100,c.patience+3*dt);
      if(Math.random()<dt*9)G.parts.push({x:c.x+16+rand(-4,4),y:c.y-34+rand(-4,4),vx:rand(-30,-10),vy:rand(-14,6),life:.45,color:'#ffffff',size:rand(1.4,2.6),kind:'bubble'});
      if(c.timer<=0){releaseSeat(c);c.wrap=false;c.yang=false;c.dressed=true;c.state='toBasket';}
      break;}
    case 'toBasket':{const p=L.basket.drop;drain=.5;if(walk(c,p.x+c.off*.4,p.y,dt)){
        if(G.basket<basketCap()){G.basket++;if(G.basket>=basketCap()-1)hint('hintBasket');}
        else{G.trash.push({x:c.x+rand(-16,16),y:c.y+rand(8,20)});repHit(-.06,'basket');float(c.x,c.y-50,t('overflow'),'#ff8a7a',12,true);hint('hintTrash');}
        afterBasket(c);} break;}
    case 'toSnack':{const tail=L.squeue(G.squeue.length);drain=1;
      if(walk(c,tail.x,tail.y,dt)||Math.hypot(tail.x-c.x,tail.y-c.y)<14){G.squeue.push(c);c.state='squeue';} break;}
    case 'squeue':{const i=G.squeue.indexOf(c),p=L.squeue(i);drain=c.moving?1.5:3.2;
      if(walk(c,p.x,p.y,dt)&&i===0){c.state='snackWait';hint('hintSnack');} break;}
    case 'snackWait': drain=4; break;
    case 'toPay':{const tail=L.queue(G.queue.length);drain=1;
      if(walk(c,tail.x,tail.y,dt)||Math.hypot(tail.x-c.x,tail.y-c.y)<14){G.queue.push(c);c.state='queue';} break;}
    case 'queue':{const i=G.queue.indexOf(c),p=L.queue(i);drain=c.moving?2:3.6;
      if(walk(c,p.x,p.y,dt)&&i===0){c.state='counter';hint('hintCounter');} break;}
    case 'counter': drain=4.5; break;
    case 'leave': case 'angry': if(walk(c,L.door.x+c.off*.5,L.H+40,dt,125))c.gone=true; break;
  }
  if(drain>0){c.patience-=drain*dayMult*dt;if(c.patience<=0&&c.state!=='leave'&&c.state!=='angry')goAngry(c);}

  }

function tubComfort(id){const tp=G.tubs[id].temp,b=BAND[id];return tp<b[0]?-1:tp>b[1]?1:0;}
function doAct(c,dt){
  const a=c.act;
  if(a==='scrub'){
    const b=c.bed;
    if(b.spots.every(s=>s.hp<=0)){
      G.inc.seshin+=PRICE.seshin;G.scrubs++;repHit(.08,'scrub');
      float(c.x,c.y-48,won(PRICE.seshin),'#ffffff',15,true);setTimeout(()=>G&&float(c.x,c.y-70,t('scrubDone'),'#bff0e8',12),200);
      burst(c.x,c.y-10,'#ffcf4a',10,90,'coin');sfx.coin();sfx.ahh();
      c.patience=Math.min(100,c.patience+15);c.state='outAct';return 0;
    }
    return staffOnBed(b)?.4:1.1;
  }
  if(a==='shower'){c.timer-=dt;c.patience=Math.min(100,c.patience+2*dt);
    if(c.timer<=0)c.state='outAct';return 0;}
  if(a==='massage'){c.timer-=dt;c.patience=Math.min(100,c.patience+4*dt);
    if(c.timer<=0){G.inc.massage+=PRICE.massage;G.massages++;float(c.x,c.y-50,won(PRICE.massage),'#ffffff',13,true);sfx.coin();c.state='outAct';}
    return 0;}
  if(c.doze){
    c.dozeT-=dt;
    if(c.dozeT<=0){c.doze=false;c.patience-=35;repHit(-.4,'faint');float(c.x,c.y-40,t('faint'),'#ff8a7a',13,true);sfx.angry();c.state='outAct';}
    return 0;
  }
  c.timer-=dt;
  if(c.dozeAt>0&&c.timer<=c.dozeAt){c.dozeAt=-1;c.doze=true;c.dozeT=6.5;hint('hintDoze');tone(260,.3,'sine',.04,0,180);return 0;}
  let drain=0;
  if(a==='sauna'){
    if(G.broken){drain=3;}
    else c.patience=Math.min(100,c.patience+3*dt);
  } else {
    const cf=tubComfort(a);G.tt+=dt;
    if(cf===0){G.tg+=dt;c.patience=Math.min(100,c.patience+3*dt);}
    else{drain=5;
      if(!c.warned){c.warned=true;float(c.x,c.y-36,cf<0?t('tooCold'):t('tooHot'),cf<0?'#a8d8ff':'#ffb09a',12,true);hint(a==='cold'?'hintCold':'hintTemp',G.tempHintT<=0);G.tempHintT=25;}
    }
  }
  if(c.timer<=0){
    if(a==='sauna'){c.yang=true;G.saunas++;}
    if(drain===0&&Math.random()<.35)float(c.x,c.y-36,t('ahh'),'#fff1c9',11);
    if(drain>0)repHit(-.06,'cold');
    c.state='outAct';
  }
  return drain;
}

function updateStaff(dt){

    G.beds.forEach(b=>{if(!staffOnBed(b)||!b.occ||b.occ.state!=='do')return;const s=b.spots.find(s=>s.hp>0);if(!s)return;

  }

    const cap=towelCap();

      if(G.towels>=cap){a.state='idle';burst(L.shelf.x+L.shelf.w/2,L.shelf.y+L.shelf.h/2,'#2a9d92',8,70,'spark');} }
  }
  // cleaning aunties
  const lvc=save.up.cleaner, spd=[0,72,90][lvc], rate=[0,55,70][lvc];
  for(const cl of G.staff.cleaners){
    if(cl.target&&!G.dirt.includes(cl.target)) cl.target=null;
    if(!cl.target){let best=null,bd=1e9;for(const d of G.dirt){if(cl.zone&&zoneOf(d.x,d.y)!==cl.zone)continue;if(G.staff.cleaners.some(o=>o!==cl&&o.target===d))continue;const dd=Math.hypot(d.x-cl.x,d.y-cl.y);if(dd<bd){bd=dd;best=d;}}cl.target=best;if(best)hint('hintCleaner');}
    if(cl.target){
      const d=cl.target;
      if(Math.hypot(d.x-cl.x,d.y-cl.y)<d.r+6){cl.moving=false;cl.mopT=(cl.mopT||0)+dt;d.hp-=rate*dt;

        if(d.hp<=0)removeDirt(d);}
      else{cl.mopT=0;walk(cl,d.x,d.y,dt,spd);}
    } else {cl.mopT=0;walk(cl,cl.idle.x,cl.idle.y,dt,60);}
  }
}

function update(dt){
  G.t+=dt;flash=Math.max(0,flash-dt);G.pop=Math.max(0,G.pop-dt);G.tempHintT-=dt;
  const h=hour(),d=save.day;
  if(G.t<G.dur){
    let rate=Math.max(1.7,4.2-.2*(d-1));
    if(d===1&&G.t<12)rate*=1.4;
    if(h>=7&&h<8.6){rate*=.7;if(!G.rushAM&&d>1){G.rushAM=true;hint('rushAM',true);}}
    else if(h>=12&&h<14)rate*=1.35;
    else if(h>=17.4&&h<19){rate*=.7;if(!G.rushPM){G.rushPM=true;hint('rushPM',true);}}
    if(G.weekend)rate*=.82;if(G.holiday)rate*=.72;if(G.snow)rate*=.86;
    G.spawnT-=dt;
    const active=G.customers.filter(c=>c.state!=='leave'&&c.state!=='angry').length;
    const cap=Math.min(18,8+Math.floor(d/2)+(save.up.sauna?2:0)+(save.up.cold?1:0));
    if(G.spawnT<=0){if(active<cap)spawnCustomer();G.spawnT=rand(.6,1.4)*rate;}
    G.dirtT-=dt*(G.snow?1.6:1);if(G.dirtT<=0){addDirt(rand(L.floor.x,L.floor.x+L.floor.w),rand(L.floor.y,L.floor.y+L.floor.h));G.dirtT=rand(5,8)/(1+.11*(d-1));}
    if(h>=13&&!G.otterDone){G.otterDone=true;G.otter={x:L.door.x-40,y:L.H+30,state:'in',t:0,fed:false,step:0};hint('hintOtter');}
    if(G.breakAt&&h>=G.breakAt&&!G.brokeDone){G.brokeDone=true;G.broken={taps:0};hint('hintBoiler',true);sfx.alarm();}
  }
  // tub temperatures
  const bk=(1-.15*save.up.boiler)*(.55+.05*Math.min(d-1,14));
  L.tubs.forEach(tb=>{
    if(isLocked(tb))return;
    const st=G.tubs[tb.id],n=st.occ.filter(Boolean).length,held=G.holding&&G.holding.kind==='tub'&&G.holding.id===tb.id;
    if(tb.id==='cold'){if(!held)st.temp+=(27-st.temp)*.012*(1+.25*n)*bk*dt;}
    else if(!held||G.broken){st.temp-=(st.temp-29)*.0125*(1+.25*n)*bk*(G.snow?1.3:1)*(G.broken?3:1)*dt;}
    if(tb.id!=='cold'&&Math.random()<dt*(st.temp-30)*.25){G.steam.push({x:rand(tb.x+12,tb.x+tb.w-12),y:rand(tb.y+20,tb.y+tb.h-16),r:rand(8,16),life:rand(1.4,2.2),max:2.2,vx:rand(-6,6)});}
  });
  G.customers.forEach(c=>updateCustomer(c,dt));
  G.customers=G.customers.filter(c=>!c.gone);
  if(G.queue[0]&&G.queue[0].state==='counter'){G.cashT=(G.cashT||0)+dt;if(G.cashT>=cashTime()){G.cashT=0;checkout();}}else G.cashT=0;
  updateStaff(dt);updateOtter(dt);stepHold(dt);
  G.lostItems.forEach(li=>li.t+=dt);
  G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.kind==='bubble'||p.kind==='heart'?-10:p.kind==='ttae'?90:60)*dt;p.life-=dt;});G.parts=G.parts.filter(p=>p.life>0);
  G.steam.forEach(s=>{s.y-=14*dt;s.x+=s.vx*dt;s.life-=dt;});G.steam=G.steam.filter(s=>s.life>0);if(G.steam.length>60)G.steam.splice(0,G.steam.length-60);
  G.floats.forEach(f=>{f.y-=26*dt;f.life-=dt;});G.floats=G.floats.filter(f=>f.life>0);
  const cl=cleanliness();G.cleanSum+=cl*dt;G.cleanN+=dt;
  if(cl<50&&G.t<G.dur){G.dirtyT+=dt;if(G.dirtyT>=4){G.dirtyT=0;hint('hintDirtyRep');repHit(cl<25?-.15:-.06,cl<25?'filthy':'dirty');}}else G.dirtyT=Math.min(G.dirtyT,2);
  if(G.broken){G.alarmT-=dt;if(G.alarmT<=0){G.alarmT=2.2;sfx.alarm();}}
  if(!G.danger&&G.rep<2.2){G.danger=true;}else if(G.danger&&G.rep>=2.5)G.danger=false;
  if(G.danger&&!G.broken){G.alarmT-=dt;if(G.alarmT<=0){G.alarmT=1.6;sfx.alarm();}}
  {const n=G.shower.occ.filter(c=>c&&c.state==='do').length;Water.set(mode==='play'?Math.min(.05,n*.014):0);
   const nd=G.customers.filter(c=>c.state==='dry').length;Dryer.set(mode==='play'?Math.min(.05,nd*.022):0);}
  if(G.rep<=1)return endShift(true);
  if(G.t>=G.dur){
    const busy=G.customers.some(c=>c.state!=='leave'&&c.state!=='angry');
    if(!busy||G.t>=G.dur+14){G.customers.forEach(c=>{if(c.state!=='leave'&&c.state!=='angry'){
        if(c.wrap||c.dressed){let fee=PRICE.entry+(c.plan.includes('sauna')&&save.up.sauna?PRICE.sauna:0)+(G.weekend?1000:0)+(G.holiday?2000:0);if(c.kid)fee=Math.round(fee/2);G.inc.entry+=fee;G.served++;}
        releaseAct(c);releaseSeat(c);c.state='leave';}});endShift(false);}
  }
}

/* switching between the tall and wide layouts mid-shift: every person and puddle keeps its relative spot in its room */

    g.drawImage(charSprite(v,Math.floor(e.t*4+i)%2&&e.t>3?1:0,'happy'),x-20*k,cy-38*k-hop,40*k,53.3*k);});
  // otter
  const ox=W/2+3.8*sp,oy=cy+4;g.drawImage(OTTER[Math.floor(e.t*3)%2],ox-20*sc,oy-24*sc-(e.t>3?Math.abs(Math.sin(e.t*6))*10:0),40*sc,40*sc);
  // fireworks + confetti
  if(e.t>3.4){e.fwT-=dt;if(e.fwT<=0){e.fwT=rand(.35,.9);popFirework(e,W,H);}}
  e.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.kind==='fw'?40:220)*dt;p.vx*=p.kind==='cf'?.99:.985;p.life-=dt;if(p.rot!=null)p.rot+=p.vr*dt;});
  e.parts=e.parts.filter(p=>p.life>0&&p.y<H+20);
  e.parts.forEach(p=>{g.globalAlpha=Math.min(1,p.life);g.fillStyle=`hsl(${p.hue},90%,${p.kind==='fw'?65:58}%)`;
    if(p.kind==='cf'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillRect(-4,-2,8,4);g.restore();}else{g.beginPath();g.arc(p.x,p.y,2.2,0,7);g.fill();}});
  g.globalAlpha=1;
  // fade in
  if(e.t<1.2){g.fillStyle=`rgba(11,31,34,${1-e.t/1.2})`;g.fillRect(0,0,W,H);}
  if(e.t>7&&!e.rolling&&!e.done){e.rolling=true;const c=$('#credits');const dur=Math.max(30,Math.min(48,c.scrollHeight/40));c.style.setProperty('--dur',dur+'s');$('#scrEnd').classList.add('rolling');
    c.addEventListener('animationend',finishCredits,{once:true});
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){$('#endBtns').hidden=false;}}
  requestAnimationFrame(endFrame);
}
$('#bSkip').addEventListener('click',finishCredits);
$('#bEndOk').addEventListener('click',closeEnding);
$('#bReplay').addEventListener('click',startEnding);
$('#bStart').addEventListener('click',startShift);
$('#bRot').addEventListener('click',()=>{ROT=!ROT;try{localStorage.setItem('otterbath.rot',ROT?'1':'0');}catch(e){}fitKey='';fit();});
$('#bNext').addEventListener('click',nextDay);
$('#bShop1').addEventListener('click',()=>openShop('#scrTitle'));
$('#bShop2').addEventListener('click',()=>openShop('#scrSum'));
$('#bBack').addEventListener('click',()=>{if(shopReturn==='#scrSum')show('#scrSum');else toTitle();});
$('#bLang').addEventListener('click',()=>{save.lang=save.lang==='ko'?'en':'ko';persist();applyI18n();BG=null;});
$('#bPause').addEventListener('click',()=>{mode==='play'?pauseGame():mode==='pause'&&resumeGame();});
$('#bResume').addEventListener('click',resumeGame);
$('#bQuit').addEventListener('click',toTitle);
$('#bAd').addEventListener('click',playAd);
function syncSound(){$('#bSound').textContent=save.muted?'♪̸':'♪';$('#bSound').setAttribute('aria-pressed',String(!save.muted));}
$('#bSound').addEventListener('click',()=>{save.muted=!save.muted;persist();syncSound();ensureAudio();Music.sync();});
document.addEventListener('pointerdown',()=>ensureAudio(),{once:true});
window.addEventListener('wheel',e=>{if(mode==='play')e.preventDefault();},{passive:false});

buildItems();buildOtter();drawLogo();
syncSound();fit();applyI18n();show('#scrTitle');CG.init();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{BG=null;});
requestAnimationFrame(frame);
})();
</script>

<script>document.getElementById('bStart')?.addEventListener('click',()=>window.dfTrack?.('game_start',{game:'otter_bathhouse'}))</script>
