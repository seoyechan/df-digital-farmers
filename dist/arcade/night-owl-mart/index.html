<style>
/* Layout: one-screen night-shift game. LED status strip on top, a fitted canvas store below, menu cards float over the store. */
:root{
  --night:#0d1320;
  --panel:#161f31;
  --panel-2:#1d2840;
  --line:#2b3853;
  --fluor:#e8f3ef;
  --muted:#93a3c0;
  --owl:#ffb347;
  --owl-ink:#2a1a04;
  --teal:#43d1b5;
  --warn:#ff6a5c;
  --scrim:rgba(9,13,22,.74);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --led:"DotGothic16",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--fluor);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}
.led{font-family:var(--led);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.clock{font-size:22px;color:var(--teal);background:#08101a;border:1px solid var(--line);border-radius:8px;padding:2px 10px;text-shadow:0 0 8px rgba(67,209,181,.55)}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.meter{width:56px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;background:var(--teal);transition:width .2s}
.hud .grow{flex:1}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fluor);border-radius:8px;height:34px;min-width:34px;padding:0 10px;font:600 13px var(--body);cursor:pointer}
.iconbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--owl);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#cv{display:block;touch-action:none;border-radius:10px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.45)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);padding:12px;box-sizing:border-box;overflow:auto}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.sign{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px 12px;border-radius:12px;background:#0a0f19;border:1px solid var(--line)}
.sign h1{margin:0;font:400 40px/1 var(--display);color:var(--owl);text-shadow:0 0 14px rgba(255,179,71,.6),0 0 2px #fff3;text-wrap:balance;text-align:center}
.sign .sub{font-family:var(--led);color:var(--teal);font-size:13px;letter-spacing:.18em}
.owl{width:46px;height:22px;display:flex;gap:6px;justify-content:center}
.owl i{width:20px;height:20px;border-radius:50%;background:var(--owl);box-shadow:inset 0 0 0 5px #0a0f19,0 0 10px rgba(255,179,71,.6);animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.owl i{animation:none}}
.tagline{margin:0;color:var(--muted);font-size:14px;line-height:1.55;text-align:center;text-wrap:balance}
.how{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;font-size:14px}
.how kbd{font:400 15px var(--display);color:var(--owl-ink);background:var(--owl);border-radius:6px;padding:4px 0;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;font:400 18px var(--display);cursor:pointer;flex:1;min-width:120px}
.btn.primary{background:var(--owl);color:var(--owl-ink)}
.btn.ghost{background:transparent;color:var(--fluor);border:1px solid var(--line);font:600 15px var(--body)}
.btn.ad{background:var(--panel-2);color:var(--fluor);border:1px dashed var(--teal);font:600 15px var(--body)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meta b{color:var(--fluor);font-variant-numeric:tabular-nums}
h2{margin:0;font:400 28px/1.1 var(--display);color:var(--owl);text-wrap:balance}
.lines{display:grid;gap:6px;margin:0}
.lines div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.lines dt{color:var(--muted)}
.lines dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.lines .total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-size:17px}
.lines .total dd{color:var(--owl)}
.note{font-size:11px;color:var(--muted);text-align:center;margin:-8px 0 0}
.upgrades{display:grid;gap:10px}
.up{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.up h3{margin:0;font-size:15px}
.up p{margin:0;font-size:12px;color:var(--muted);grid-column:1}
.pips{display:flex;gap:4px;grid-column:1}
.pips i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--teal)}
.up .btn{grid-row:1/span 3;grid-column:2;min-width:96px;font:600 13px var(--body);padding:10px}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(92%,420px);background:var(--owl);color:var(--owl-ink);font-weight:700;font-size:13px;line-height:1.4;padding:8px 14px;border-radius:999px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}
.adplay{position:absolute;inset:0;display:grid;place-items:center;background:#05080e;color:var(--muted);font:400 22px var(--led);text-align:center}
</style>

/* ---------- game state ---------- */
let mode='title', G=null, ptr=null, doorOpen=0, hintTimer=0, lastTs=0, scanFlash=0;

function newShift(){
  G={t:0,dur:150,customers:[],queue:[],dirt:[],parts:[],floats:[],stock:{},
     sales:0,tips:0,served:0,lost:0,rep:5,spawnT:.8,dirtT:rand(4,6),
     cat:null,catDone:false,holding:null,cleanSum:0,cleanN:0,rushShown:false};
  L.shelves.forEach(s=>G.stock[s.id]=shelfCap());
}
function hint(key,force){
  if(!force && save.hints[key]) return;
  save.hints[key]=1; persist();
  const el=$('#hint'); el.textContent=t(key); el.hidden=false; hintTimer=4.5;
}
function float(x,y,text,color='#ffffff',size=15,pill){G.floats.push({x,y,text,color,size,life:1.3,pill});}
function burst(x,y,color,n=8,spd=80,kind){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rand(spd*.4,spd);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.4,.8),color,size:rand(2,4),kind});}}
function hour(){return 22+8*Math.min(1,G.t/G.dur);}
function clockText(){const h=hour(),hh=Math.floor(h)%24,mm=Math.floor((h%1)*60/10)*10;return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function cleanliness(){let s=0;G.dirt.forEach(d=>s+=d.hp/100*12);return Math.max(0,100-s);}
function cleanMult(){return 0.4+0.6*cleanliness()/100;}
function validFloor(x,y){
  const f=L.floor; if(x<f.x||x>f.x+f.w||y<f.y||y>f.y+f.h) return false;
  if(inRect({x,y},L.counter,34)) return false;
  return !L.shelves.some(s=>inRect({x,y},s,30));
}
function addDirt(x,y,kind){
  if(G.dirt.length>=10) return;
  for(let k=0;k<12&&!validFloor(x,y);k++){x=rand(L.floor.x,L.floor.x+L.floor.w);y=rand(L.floor.y,L.floor.y+L.floor.h);}
  if(!validFloor(x,y)) return;
  kind=kind||pick(['spill','mud','coffee','spill']);
  const lobes=[];for(let i=0;i<8;i++)lobes.push(rand(.72,1.12));
  G.dirt.push({x,y,r:rand(17,27),hp:100,kind,lobes,rot:Math.random()*6});
  hint('hintDirt');
}

/* ---------- customers ---------- */
function spawnCustomer(){
  const pool=['drink','ramen','snack','kimbap'].concat(save.up.coffee?['coffee']:[]);
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  const d=save.day;
  let n=1+(Math.random()<.55?1:0)+(d>=2&&Math.random()<.28?1:0)+(d>=4&&Math.random()<.2?1:0);
  if(save.up.coffee&&Math.random()<.35&&!pool.slice(0,n).includes('coffee')) pool.splice(0,0,'coffee');
  const wants=pool.slice(0,Math.min(n,pool.length));
  const sleepy=d>=2&&Math.random()<.1&&!G.customers.some(c=>c.type==='sleepy');
  G.customers.push({x:L.door.x+rand(-18,18),y:L.H+30,state:'enter',wants,idx:0,picked:[],scanned:0,
    patience:100,type:sleepy?'sleepy':'normal',wake:0,v:randVariant(),
    off:rand(-26,26),hit:new Set(),timer:0,step:Math.random()*6,moving:false});
  sfx.chime();
}
function moveTo(c,tx,ty,dt,spd=105){
  const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
  if(d<3){c.x=tx;c.y=ty;c.moving=false;return true;}
  const s=Math.min(d,spd*dt);c.x+=dx/d*s;c.y+=dy/d*s;c.step+=dt*8;c.moving=true;return false;
}
function frontPoint(c){
  const s=shelfById(c.wants[c.idx]);
  return s.vertical?{x:s.front.x,y:s.front.y+c.off*1.6}:{x:s.front.x+c.off*1.4,y:s.front.y};
}
function tryTake(c){
  const id=c.wants[c.idx];
  if(G.stock[id]>0){
    G.stock[id]--; c.picked.push(id); c.idx++;
    if(G.stock[id]<=1) hint('hintStock');
    if(Math.random()<.18) addDirt(c.x+rand(-20,20),c.y+rand(14,34),id==='coffee'?'coffee':id==='drink'?'spill':pick(['spill','mud']));
    if(c.idx<c.wants.length) c.state='toShelf';
    else {G.queue.push(c);c.state='toQueue';}
  } else c.state='waitShelf';
}
function goAngry(c){
  const qi=G.queue.indexOf(c); if(qi>=0) G.queue.splice(qi,1);
  c.state='angry'; G.lost++; G.rep=Math.max(0,G.rep-0.6);
  float(c.x,c.y-50,t('angry'),'#ff6a5c',15,true); sfx.angry();
}
function pay(c){
  const sum=c.picked.reduce((a,id)=>a+PRICE[id],0);
  const tip=Math.round(c.patience/100*900*cleanMult()/100)*100;
  G.sales+=sum; G.tips+=tip; G.served++;
  if(c.patience>60) G.rep=Math.min(5,G.rep+0.1);
  c.happy=c.patience>45;
  float(c.x,c.y-58,won(sum),'#e8f3ef',15,true);
  if(tip>0) setTimeout(()=>G&&float(c.x,c.y-38,t('tip')+' +'+won(tip),'#ffb347',13,true),180);
  burst(c.x,c.y-20,'#ffcf4a',10,90,'coin'); sfx.coin();
  G.queue.shift(); c.state='leave';
}
function scan(){
  const c=G.queue[0];
  if(!c||c.state!=='counter') return;
  if(c.type==='sleepy'&&c.wake<6){
    c.wake++; tone(500+c.wake*80,.06,'triangle',.05);
    float(c.x+rand(-10,10),c.y-56,c.wake>=6?t('awake'):t('wakeUp'),c.wake>=6?'#43d1b5':'#e8f3ef',13);
    return;
  }
  c.scanned=Math.min(c.picked.length,c.scanned+scanPow());
  scanFlash=.12; sfx.scan(); burst(L.counter.x+52,L.counter.y+46,'#ff5a4a',4,50);
  if(c.scanned>=c.picked.length) pay(c);
}
function updateCustomer(c,dt){
  const dayMult=(1+0.08*(save.day-1))*(save.up.music?0.8:1);
  let drain=0;
  switch(c.state){
    case 'enter': if(moveTo(c,L.door.x+c.off*.5,L.H-58,dt)) c.state='toShelf'; break;
    case 'toShelf':{const p=frontPoint(c); drain=.8; if(moveTo(c,p.x,p.y,dt)){c.state='pick';c.timer=.4;} break;}
    case 'pick': drain=.8; c.timer-=dt; if(c.timer<=0) tryTake(c); break;
    case 'waitShelf': drain=12; tryTake(c); break;
    case 'toQueue':
    case 'queue':{
      const i=G.queue.indexOf(c), p=L.queue(i); drain=c.state==='queue'?4:1;
      if(moveTo(c,p.x,p.y,dt)){ if(i===0){c.state='counter';hint('hintScan');if(c.type==='sleepy')hint('hintSleepy');} else c.state='queue'; }
      break;}
    case 'counter': drain=5; break;
    case 'leave': case 'angry':
      if(moveTo(c,L.door.x+c.off*.5,L.H+40,dt,125)) c.gone=true; break;
  }
  if(drain>0){ c.patience-=drain*dayMult*dt; if(c.patience<=0) goAngry(c); }
  if(c.state!=='leave'&&c.state!=='angry'){
    for(const d of G.dirt){ if(!c.hit.has(d)&&Math.hypot(d.x-c.x,d.y-c.y)<d.r+8){c.hit.add(d);c.patience-=10;float(c.x,c.y-50,t('slip'),'#93c5ff',12);} }
  }
}

/* ---------- cat ---------- */
function updateCat(dt){
  const c=G.cat; if(!c) return; c.t+=dt;
  const sit={x:L.door.x-96,y:L.H-74};
  if(c.state==='in'){ if(moveTo(c,sit.x,sit.y,dt,70)) c.state='sit'; }
  else if(c.state==='sit'){ if(c.t>15) c.state='out'; }
  else if(c.state==='out'){ if(moveTo(c,L.door.x-40,L.H+40,dt,90)) G.cat=null; }
}
function feedCat(){
  const c=G.cat; c.fed=true; c.state='out'; G.rep=Math.min(5,G.rep+0.3);
  float(c.x,c.y-34,t('catFed'),'#ffb347',14,true); burst(c.x,c.y-10,'#ff7a9a',12,70,'heart'); sfx.meow();
}

/* ---------- scrub / hold ---------- */
function scrubAt(x,y,moved){
  for(let i=G.dirt.length-1;i>=0;i--){
    const d=G.dirt[i];
    if(Math.hypot(d.x-x,d.y-y)<d.r+mopR()){
      d.hp-=(moved*1.15+0.5)*mopPow();
      if(Math.random()<.4) G.parts.push({x:x+rand(-10,10),y:y+rand(-10,10),vx:rand(-20,20),vy:rand(-34,-6),life:.55,color:'#ffffff',size:rand(2,4.5),kind:'bubble'});
      if(d.hp<=0){G.dirt.splice(i,1);burst(d.x,d.y,'#bff6ea',12,90,'spark');float(d.x,d.y-24,t('clean'),'#43d1b5',14);sfx.clean();}
    }
  }
}
function startHold(s){
  if(isLocked(s)){float(s.x+s.w/2,s.y+s.h+22,t('locked'),'#ffb347',12,true);return false;}
  if(G.stock[s.id]>=shelfCap()){float(s.x+s.w/2,s.y+s.h+22,t('full'),'#93a3c0',12);return false;}
  G.holding={id:s.id,t:0}; return true;
}

/* ---------- loop ---------- */
function update(dt){
  G.t+=dt; scanFlash=Math.max(0,scanFlash-dt);
  const h=hour(), d=save.day;
  if(G.t<G.dur){
    let rate=Math.max(1.25,3.0-0.22*(d-1));
    if(d===1&&G.t<15) rate*=1.5;
    if(h>=24&&h<24.8){rate/=2; if(!G.rushShown){G.rushShown=true;hint('rush',true);}}
    else if(h>=25.2&&h<26) rate*=1.35;
    G.spawnT-=dt;
    const active=G.customers.filter(c=>c.state!=='leave'&&c.state!=='angry').length;
    const cap=Math.min(15,10+Math.floor(d/2));
    if(G.spawnT<=0){ if(active<cap) spawnCustomer(); G.spawnT=rand(.6,1.4)*rate; }
    G.dirtT-=dt; if(G.dirtT<=0){addDirt(rand(L.floor.x,L.floor.x+L.floor.w),rand(L.floor.y,L.floor.y+L.floor.h));G.dirtT=rand(4,7)/(1+0.1*(d-1));}
    if(h>=28&&!G.catDone){G.catDone=true;G.cat={x:L.door.x-40,y:L.H+30,state:'in',t:0,fed:false,step:0};hint('hintCat');}
  }
  G.customers.forEach(c=>updateCustomer(c,dt));
  G.customers=G.customers.filter(c=>!c.gone);
  updateCat(dt);
  if(G.holding){ G.holding.t+=dt; if(G.holding.t>=holdTime()){const s=shelfById(G.holding.id);G.stock[s.id]=shelfCap();burst(s.x+s.w/2,s.y+s.h/2,'#43d1b5',10,80,'spark');sfx.stock();G.holding=null;} }
  G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.kind==='bubble'||p.kind==='heart'?-10:60)*dt;p.life-=dt;}); G.parts=G.parts.filter(p=>p.life>0);
  G.floats.forEach(f=>{f.y-=26*dt;f.life-=dt;}); G.floats=G.floats.filter(f=>f.life>0);
  G.cleanSum+=cleanliness()*dt; G.cleanN+=dt;
  if(G.rep<=1) return endShift(true);
  if(G.t>=G.dur){
    const busy=G.customers.some(c=>c.state!=='leave'&&c.state!=='angry');
    if(!busy||G.t>=G.dur+12) endShift(false);
  }
}

/* ---------- drawing ---------- */
function shadow(x,y,rx,ry,a=.2){ctx.fillStyle=`rgba(20,30,45,${a})`;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}

function drawStock(s,x,y,w,h,cap,stock,locked,vertical){

function fit(){
  const r=stage.getBoundingClientRect();
  if(mode!=='play'&&mode!=='pause'){ L=(r.width/Math.max(1,r.height))>=1.1?LAYOUTS.land:LAYOUTS.port; }
  scale=Math.min(r.width/L.W,r.height/L.H);
  dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.style.width=Math.floor(L.W*scale)+'px';canvas.style.height=Math.floor(L.H*scale)+'px';
  canvas.width=Math.floor(L.W*scale*dpr);canvas.height=Math.floor(L.H*scale*dpr);
}

function toLogical(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio(); if(mode!=='play') return;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  const p=toLogical(e); ptr={x:p.x,y:p.y,mode:'none'};
  if(G.cat&&!G.cat.fed&&G.cat.state!=='out'&&dist(p,G.cat)<44){feedCat();return;}
  const f=G.queue[0];
  if(inRect(p,L.counter,12)||(f&&f.state==='counter'&&dist(p,f)<38)){scan();ptr.mode='tap';return;}
  const s=L.shelves.find(s=>inRect(p,s,10));
  if(s){if(startHold(s))ptr.mode='hold';ptr.shelf=s;return;}
  ptr.mode='scrub'; scrubAt(p.x,p.y,4);
});
canvas.addEventListener('pointermove',e=>{
  if(!ptr||mode!=='play') return;
  const p=toLogical(e);
  if(ptr.mode==='scrub'){
    const d=Math.hypot(p.x-ptr.x,p.y-ptr.y), steps=Math.max(1,Math.ceil(d/6));
    for(let i=1;i<=steps;i++) scrubAt(ptr.x+(p.x-ptr.x)*i/steps,ptr.y+(p.y-ptr.y)*i/steps,d/steps);
  } else if(ptr.mode==='hold'&&!inRect(p,ptr.shelf,24)){G.holding=null;ptr.mode='none';}
  ptr.x=p.x;ptr.y=p.y;
});
function endPtr(){ if(ptr&&ptr.mode==='hold'&&G) G.holding=null; ptr=null; }
canvas.addEventListener('pointerup',endPtr);

window.addEventListener('keydown',e=>{
  if(mode==='play'&&!e.target.closest('button')&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();ensureAudio();scan();}
  else if(e.code==='KeyP'||e.code==='Escape'){mode==='play'?pauseGame():mode==='pause'&&resumeGame();} else if(mode==='play'&&/^Digit[1-5]$/.test(e.code)&&!e.repeat){startHold(L.shelves[Number(e.code.slice(-1))-1]);}
