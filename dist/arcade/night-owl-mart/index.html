<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>올빼미 편의점</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DotGothic16&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen night-shift game. LED status strip on top, a fitted canvas store below, menu cards float over the store. */
:root{
  --night:#0d1320;
  --panel:#161f31;
  --panel-2:#1d2840;
  --line:#2b3853;
  --fluor:#e8f3ef;
  --muted:#93a3c0;
  --owl:#ffb347;
  --owl-ink:#2a1a04;
  --teal:#43d1b5;
  --warn:#ff6a5c;
  --scrim:rgba(9,13,22,.74);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --led:"DotGothic16",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--fluor);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.hud{position:relative;display:flex;align-items:stretch;align-self:center;width:auto;max-width:100%;height:50px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}
.led{font-family:var(--led);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.seg{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 12px;min-width:0;border-left:1px solid var(--line)}
.seg:first-child{border-left:0}
.seg-time{flex:0 0 auto;background:#08101a;align-items:flex-start}
.clock{font-size:22px;line-height:1;color:var(--teal);text-shadow:0 0 10px rgba(67,209,181,.55)}
.dayrow{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1;white-space:nowrap}
.dayrow b{font-weight:700;color:var(--muted)}
.stat{flex:0 0 auto;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:0 20px}
.stat .meter{width:110px;flex:0 0 auto}
#hTips{min-width:6.2em}
.stat .lbl{font-size:10px;line-height:1;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .lbl em{font-style:normal;color:var(--fluor);font-variant-numeric:tabular-nums;letter-spacing:0}
.stat b{font-size:17px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--owl)}
.stars.low{color:var(--warn)}
.meter{width:100%;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);transition:width .2s}
.seg-btns{flex:0 0 auto;flex-direction:row;align-items:center;gap:6px;padding:0 8px}
.seg-btns .iconbtn{height:36px;width:36px;min-width:0;padding:0;font-size:16px;border-radius:9px}
.pz{display:inline-flex;gap:3px}.pz i{width:4px;height:12px;border-radius:2px;background:var(--fluor)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(43,56,83,.6)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b5ea8,var(--owl))}
@media (max-width:840px){
  .stat{flex:1 1 0;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:0 8px}
  .stat .meter{flex:0 0 auto;width:100%}
  #hTips{min-width:0}
  .stat .lbl em{display:none}
  .rainbadge .rnt{display:none}
  .hud{height:46px}
  .seg{padding:0 8px}
  .clock{font-size:18px}
  .stat b{font-size:14px}
  .stat .lbl{font-size:9px;letter-spacing:.02em}
  .seg-btns{padding:0 5px;gap:4px}
  .seg-btns .iconbtn{height:32px;width:32px;font-size:14px}
}
.rainbadge{font:600 10px var(--body);color:#bfe3ff;background:#132640;border:1px solid #2c4d7a;border-radius:999px;padding:1px 6px}
.grp{margin:4px 0 -2px;font:400 15px var(--display);color:var(--teal);letter-spacing:.04em}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fluor);border-radius:8px;height:34px;min-width:34px;padding:0 10px;font:600 13px var(--body);cursor:pointer}
.iconbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--owl);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:start center}
#cv{display:block;touch-action:none;border-radius:10px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.45)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:12px;box-sizing:border-box;overflow:auto}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.sign{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px 12px;border-radius:12px;background:#0a0f19;border:1px solid var(--line)}
.sign h1{margin:0;font:400 40px/1 var(--display);color:var(--owl);text-shadow:0 0 14px rgba(255,179,71,.6),0 0 2px #fff3;text-wrap:balance;text-align:center}
.sign .sub{font-family:var(--led);color:var(--teal);font-size:13px;letter-spacing:.18em}
.owl{width:46px;height:22px;display:flex;gap:6px;justify-content:center}
.owl i{width:20px;height:20px;border-radius:50%;background:var(--owl);box-shadow:inset 0 0 0 5px #0a0f19,0 0 10px rgba(255,179,71,.6);animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.owl i{animation:none}}
.tagline{margin:0;color:var(--muted);font-size:14px;line-height:1.55;text-align:center;text-wrap:balance}
.how{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;font-size:14px}
.how kbd{font:400 15px var(--display);color:var(--owl-ink);background:var(--owl);border-radius:6px;padding:4px 0;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;font:400 18px var(--display);cursor:pointer;flex:1;min-width:120px}
.btn.primary{background:var(--owl);color:var(--owl-ink)}
.btn.ghost{background:transparent;color:var(--fluor);border:1px solid var(--line);font:600 15px var(--body)}
.btn.ad{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel-2);color:var(--fluor);border:1px dashed var(--teal);font:600 15px var(--body)}
.btn.ad b{color:var(--owl)}
.vid{display:inline-grid;place-items:center;width:22px;height:16px;border-radius:4px;background:var(--teal);color:#0b2a25;font-size:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meta b{color:var(--fluor);font-variant-numeric:tabular-nums}
h2{margin:0;font:400 28px/1.1 var(--display);color:var(--owl);text-wrap:balance}
.lines{display:grid;gap:6px;margin:0}
.lines div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.lines dt{color:var(--muted)}
.lines dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.lines .total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-size:17px}
.lines .total dd{color:var(--owl)}
.lines dd.neg{color:var(--warn)}
.note{font-size:11px;color:var(--muted);text-align:center;margin:-8px 0 0}
.upgrades{display:grid;gap:10px}
.up{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.up h3{margin:0;font-size:15px}
.up p{margin:0;font-size:12px;color:var(--muted);grid-column:1}
.pips{display:flex;gap:4px;grid-column:1}
.pips i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--teal)}
.up .btn{grid-row:1/span 3;grid-column:2;min-width:96px;font:600 13px var(--body);padding:10px}
.danger{position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 0 6px rgba(255,59,48,.95),inset 0 0 60px 18px rgba(255,59,48,.55);animation:dangerPulse .7s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{opacity:1}50%{opacity:.25}}
.dangerbar{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:6px;max-width:92%;background:#ff3b30;color:#fff;font:700 13px var(--body);padding:7px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(255,59,48,.45);pointer-events:none;animation:dangerBar .7s ease-in-out infinite;text-align:center}
@keyframes dangerBar{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.danger,.dangerbar{animation:none}}
.reptoast{position:absolute;top:40px;left:12px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;pointer-events:none;z-index:2}
.rt{display:flex;align-items:center;gap:6px;background:rgba(22,31,49,.94);border:1.5px solid var(--warn);color:var(--fluor);border-radius:999px;padding:5px 11px;font:600 12px var(--body);box-shadow:0 6px 16px rgba(0,0,0,.35);animation:rtIn .25s ease-out;white-space:nowrap}
.rt b{color:var(--warn);font-variant-numeric:tabular-nums}
.rt.pos{border-color:var(--teal)}.rt.pos b{color:var(--teal)}
.rt.out{opacity:0;transform:translateX(-10px);transition:opacity .35s,transform .35s}
@keyframes rtIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.stars.hit{animation:repHit .5s}
@keyframes repHit{0%,100%{transform:none}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}20%,60%{color:var(--warn)}}
@media (prefers-reduced-motion:reduce){.rt,.stars.hit{animation:none}}
.repwhy{display:grid;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.repwhy h3{margin:0 0 2px;font:400 15px var(--display);color:var(--warn)}
.repwhy div{display:flex;justify-content:space-between;gap:10px}
.repwhy b{color:var(--warn);font-variant-numeric:tabular-nums}
.repwhy p{margin:0;color:var(--muted)}
.repwhy p.early{color:var(--fluor);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(92%,420px);background:var(--owl);color:var(--owl-ink);font-weight:700;font-size:13px;line-height:1.4;padding:8px 14px;border-radius:999px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}
.goalrow{display:grid;gap:6px}
.goalrow .gtext{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.goalrow .gtext b{color:var(--owl);font-variant-numeric:tabular-nums}
.gbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--owl));border-radius:4px}
.goalrow.ready .gtext span{color:var(--owl);font-weight:700}
.goalrow.owner .gtext span{color:var(--owl);font:400 16px var(--display)}
.up.goal{background:linear-gradient(135deg,rgba(255,179,71,.16),rgba(67,209,181,.10));border-color:var(--owl)}
.up.goal h3{color:var(--owl)}
.up.goal .gbar{grid-column:1}
.endov{align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(9,13,22,0) 45%,rgba(9,13,22,.7))}
@media (max-aspect-ratio:11/10){.endcard{padding:16px 18px;gap:12px}.endcard h2{font-size:21px}.endcard .tagline{display:none}}
@media (min-aspect-ratio:11/10){.endov{align-items:center;justify-content:flex-end;background:linear-gradient(90deg,rgba(9,13,22,0) 55%,rgba(9,13,22,.6))}.endcard{max-width:360px}}
.endcard{max-width:420px;animation:endIn .6s ease-out both;animation-delay:2.6s}
.endcard h2{font-size:26px}
.endcard h2,.endcard p{word-break:keep-all;overflow-wrap:break-word}
@keyframes endIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.endcard{animation:none}}

/* short desktop iframes (e.g. 907x510, 821x462): keep every menu button on screen */
@media (max-height:640px) and (min-aspect-ratio:11/10){
  .overlay{padding:8px}
  .card{padding:14px 16px;gap:10px}
  .sign{padding:8px 10px;gap:2px}.sign h1{font-size:30px}.sign .sub{font-size:11px}
  .tagline{font-size:12.5px;line-height:1.4}
  .how{gap:5px}.how li{font-size:13px}.how kbd{font-size:13px;padding:2px 0}
  .btn{padding:9px 14px;font-size:16px}.btn.ghost{font-size:14px}
  h2{font-size:22px}.lines{gap:4px}.lines div{font-size:13px}.lines .total{font-size:15px}
}
@media (max-height:540px) and (min-aspect-ratio:11/10){
  #scrTitle .owl{display:none}
  #scrTitle .tagline{display:none}
}
.sumcol{display:flex;flex-direction:column;gap:inherit}
.sumcol:empty{display:none}
@media (max-height:640px) and (min-aspect-ratio:11/10){
  #scrSum .card{max-width:780px;display:grid;grid-template-columns:1fr 1fr;column-gap:20px;align-items:start}
  #scrSum h2{grid-column:1/-1}
  #scrSum .sumcol{gap:10px}
}

/* mobile: rating changes show as a short number in the HUD instead of toasts over the store */
.rd{display:none;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}
.rd.pos{color:var(--teal)}.rd.neg{color:var(--warn)}
.mob .reptoast{display:none}
.mob #hRepL.rdon>span{display:none}
.mob #hRepL.rdon .rd{display:inline}
/* portrait: tutorial hint gets its own strip under the store */
.dangerbar.dock{border-radius:12px;padding:7px 12px;font-size:12px;line-height:1.35}
.hint.dock{border-radius:12px;padding:7px 12px;font-size:12px;line-height:1.35;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style>

<div class="danger" id="danger" hidden aria-hidden="true"></div>
<div id="app">
  <div class="hud" id="hud">
    <div class="seg seg-time">
      <div class="clock led" id="clock">22:00</div>
      <div class="dayrow"><b id="hDay">Day 1</b><span class="rainbadge" id="hRain" hidden>☂<span class="rnt"> <span data-i18n="hudRain">비</span></span></span></div>
    </div>
    <div class="seg stat"><span class="lbl" data-i18n="hudTips">팁</span><b id="hTips">₩0</b></div>
    <div class="seg stat"><span class="lbl"><span data-i18n="hudClean">청결</span> <em id="hCleanN">100%</em></span><div class="meter"><i id="hClean" style="width:100%"></i></div></div>
    <div class="seg stat"><span class="lbl" id="hRepL"><span data-i18n="hudRep">별점</span><i class="rd" id="hRepD"></i></span><b id="hRep" class="stars">★5.00</b></div>

      <button class="iconbtn" id="bSound" aria-label="sound">♪</button>

</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const canvas = $('#cv'), ctx = canvas.getContext('2d');
const stage = $('#stage');

/* ---------- text ---------- */
const T = {
  ko:{
    tagline:'밤 10시부터 아침 6시까지, 혼자 지키는 동네 편의점. 손님 계산, 진열, 청소까지 전부 당신 몫이에요.',
    howTapK:'탭', howTap:'카운터를 탭해서 바코드 찍기',
    howHoldK:'꾹', howHold:'진열대를 꾹 눌러 상품 채우기',
    howScrubK:'문지르기', howScrub:'바닥 얼룩은 손가락으로 닦기',
    saved:'모은 돈', shop:'업그레이드', lang:'English', start:'Day {d} 근무 시작',

/* Walking that goes around furniture: if the straight line to the target cuts through
   the counter, the eating table or a fixture, detour via the nearest clear corner. */
function segHits(ax,ay,bx,by,r){
  let t0=0,t1=1; const dx=bx-ax, dy=by-ay;
  const p=[-dx,dx,-dy,dy], q=[ax-r.x,r.x+r.w-ax,ay-r.y,r.y+r.h-ay];
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0) return false; }
    else { const tt=q[i]/p[i]; if(p[i]<0){ if(tt>t1) return false; if(tt>t0) t0=tt; } else { if(tt<t0) return false; if(tt<t1) t1=tt; } }
  }
  return t1-t0>1e-3?t0:false;
}
const PAD=20;
function blocker(ax,ay,bx,by){
  // the first piece of furniture along the line, not the first in the list
  let hit=null,ht=2;
  for(const r of [L.counter,L.table].concat(L.shelves)){
    const R={x:r.x-PAD,y:r.y-PAD,w:r.w+PAD*2,h:r.h+PAD*2};
    const tt=segHits(ax,ay,bx,by,{x:R.x+2,y:R.y+2,w:R.w-4,h:R.h-4});
    if(tt!==false&&tt<ht){ht=tt;hit=R;}
  }
  return hit;
}
function walk(c,tx,ty,dt,spd=105){
  if(c.lx==null||Math.hypot(c.x-c.lx,c.y-c.ly)>8){c.lx=c.x;c.ly=c.y;c.still=0;} else if(Math.hypot(tx-c.x,ty-c.y)>6){c.still=(c.still||0)+dt; if(c.still>1){c.still=0;c.wp=null;c.direct=.8;}}
  if(c.wp){ if(moveTo(c,c.wp.x,c.wp.y,dt,spd)) c.wp=null; return false; }
  const R=blocker(c.x,c.y,tx,ty);
  if(R){
    const cs=[{x:R.x,y:R.y},{x:R.x+R.w,y:R.y},{x:R.x,y:R.y+R.h},{x:R.x+R.w,y:R.y+R.h}];
    const len=k=>Math.hypot(k.x-c.x,k.y-c.y)+Math.hypot(tx-k.x,ty-k.y);
    let best=null,bl=1e9;
    // never route through a corner that sits in or past the walls (portrait counter hugs the right wall)
    // skip a corner we are already standing on, otherwise the fallback can pick it forever and the customer freezes
    const inside=k=>k.x>=22&&k.x<=L.W-22&&k.y>=40&&k.y<=L.H-8, here=k=>Math.hypot(k.x-c.x,k.y-c.y)<6;
    if(!(c.direct>0)){
      for(const k of cs){ if(!inside(k)||here(k)||blocker(c.x,c.y,k.x,k.y)||blocker(k.x,k.y,tx,ty)) continue; if(len(k)<bl){bl=len(k);best=k;} }
      if(!best) for(const k of cs){ if(!inside(k)||here(k)||blocker(c.x,c.y,k.x,k.y)) continue; if(len(k)<bl){bl=len(k);best=k;} }
      if(best){ c.wp=best; return false; }
    }
  }
  // safety net: if a walker has not really moved for a second, let it walk straight to the target for a moment
  const px=c.x,py=c.y, done=moveTo(c,tx,ty,dt,spd);
  if(c.direct>0) c.direct-=dt;
  return done;
}
function moveTo(c,tx,ty,dt,spd=105){
  const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
  if(d<3){c.x=tx;c.y=ty;c.moving=false;return true;}
  const s=Math.min(d,spd*dt);c.x+=dx/d*s;c.y+=dy/d*s;c.step+=dt*8;c.moving=true;return false;
}
function frontPoint(c){

function repDelta(d){

function repHit(delta,key){

function updateRobots(dt){
  for(const r of G.robots){
    r.spin+=dt*16;
    if(r.target&&!G.dirt.includes(r.target)) r.target=null;
    if(!r.target){
      let best=null,bd=1e9;
      for(const d of G.dirt){ if(G.robots.some(o=>o!==r&&o.target===d)) continue; const dd=Math.hypot(d.x-r.x,d.y-r.y); if(dd<bd){bd=dd;best=d;} }
      r.target=best; if(best) hint('hintRobot');
    }
    const tx=r.target?r.target.x:r.dock.x, ty=r.target?r.target.y:r.dock.y;
    const dx=tx-r.x, dy=ty-r.y, dd=Math.hypot(dx,dy);
    const reach=r.target?6:4;
    r.moving=dd>reach;
    if(r.moving){
      const want=Math.atan2(dy,dx); const da=((want-r.ang+Math.PI*3)%(Math.PI*2))-Math.PI;
      r.ang+=Math.max(-5*dt,Math.min(5*dt,da));
      const sp=robotSpeed()*(Math.abs(da)>1.2?.25:1)*Math.min(1,.35+dd/40);
      r.x+=Math.cos(r.ang)*sp*dt; r.y+=Math.sin(r.ang)*sp*dt;
    } else if(!r.target) r.ang+=((-Math.PI/2-r.ang+Math.PI*3)%(Math.PI*2)-Math.PI)*Math.min(1,dt*4);
    if(r.target&&dd<r.target.r+12){
      const d=r.target; d.hp-=robotRate()*dt;
      if(Math.random()<dt*8) G.parts.push({x:r.x+rand(-12,12),y:r.y+rand(-12,12),vx:rand(-15,15),vy:rand(-25,-5),life:.5,color:'#fff',size:rand(2,3.5),kind:'bubble'});

  }
}
function updateCustomer(c,dt){
  const dayMult=(save.day<=3?[1,.75,.85,.93][save.day]:Math.min(1.6,1+0.03*(save.day-1)))*(save.up.music?0.8:1);
  let drain=0;
  switch(c.state){
    case 'enter': if(walk(c,L.door.x+c.off*.5,L.H-58,dt)) c.state='toShelf'; break;
    case 'toShelf':{const p=frontPoint(c); drain=.8; if(walk(c,p.x,p.y,dt)){c.state='pick';c.timer=.4;} break;}
    case 'pick': drain=.8; c.timer-=dt; if(c.timer<=0) tryTake(c); break;
    case 'waitShelf': drain=12; tryTake(c); break;
    case 'toQueue':{
      // head for the end of the line as it is right now; the spot is only taken on arrival
      const tail=L.queue(G.queue.length); drain=1;
      if(walk(c,tail.x,tail.y,dt)||Math.hypot(tail.x-c.x,tail.y-c.y)<14){ G.queue.push(c); c.state='queue'; }
      break;}
    case 'queue':{
      const i=G.queue.indexOf(c), p=L.queue(i); drain=c.moving?2:4;
      if(walk(c,p.x,p.y,dt)&&i===0){c.state='counter';hint('hintScan');if(c.type==='sleepy')hint('hintSleepy');if(c.wantsBun)hint('hintBun');}
      break;}
    case 'counter': drain=5; break;
    case 'toSeat': if(walk(c,c.seat.x,c.seat.y,dt)){c.state='eat';c.timer=rand(9,13);} break;
    case 'eat':
      c.timer-=dt; c.bob=(c.bob||0)+dt;
      if(Math.random()<dt*.5) tone(rand(300,420),.12,'sine',.025);
      if(c.timer<=0){
        const st=c.seat; st.occ=null; st.trash=true; c.seat=null; c.state='leave'; c.happy=true; hint('hintTrash');
        const tip=Math.round(600*cleanMult()/100)*100; G.tips+=tip;
        float(c.x,c.y-56,t('ateTip')+' +'+won(tip),'#ffb347',12,true);
        if(Math.random()<.25){const px=c.x+rand(-24,24),py=c.y+rand(-50,-30);if(validFloor(px,py))addDirt(px,py,'coffee');}
      }
      break;
    case 'leave': case 'angry':
      if(walk(c,L.door.x+c.off*.5,L.H+40,dt,125)) c.gone=true; break;
  }
  if(drain>0){ c.patience-=drain*dayMult*dt; if(c.patience<=0) goAngry(c); }

  }
}

/* ---------- loop ---------- */
function update(dt){
  G.t+=dt; scanFlash=Math.max(0,scanFlash-dt);
  const h=hour(), d=save.day;
  if(G.t<G.dur){
    let rate=Math.max(1.9,3.1-0.08*(d-1));
    if(d===1&&G.t<15) rate*=1.5;
    if(h>=24&&h<24.8){rate/=2; if(!G.rushShown){G.rushShown=true;hint('rush',true);}}
    else if(h>=25.2&&h<26) rate*=1.35;
    G.spawnT-=dt;
    const active=G.customers.filter(c=>!['leave','angry','eat','toSeat'].includes(c.state)).length;
    const cap=Math.min(12,8+Math.floor(d/3));
    if(G.spawnT<=0){ if(active<cap) spawnCustomer(); G.spawnT=rand(.6,1.4)*rate; }
    Music.setRain(!!raining());
    if(raining()&&!G.rainShown){G.rainShown=true;hint(save.up.umbrella?'rainUmb':'rainStart',true);}
    G.dirtT-=dt*(raining()?2:1); if(G.dirtT<=0){addDirt(rand(L.floor.x,L.floor.x+L.floor.w),rand(L.floor.y,L.floor.y+L.floor.h));G.dirtT=rand(4,7)*(d<=3?1.6-0.2*d:1)/Math.min(1.8,1+0.04*(d-1));}
    if(h>=28&&!G.catDone){G.catDone=true;G.cat={x:L.door.x-40,y:L.H+30,state:'in',t:0,fed:false,step:0};hint('hintCat');}
  }
  G.customers.forEach(c=>updateCustomer(c,dt));
  G.customers=G.customers.filter(c=>!c.gone);
  updateRobots(dt);
  updateAlba(dt);
  if(save.up.hoppang&&G.buns<4){G.bunT+=dt;if(G.bunT>=4.5){G.bunT=0;G.buns++;}}
  updateCat(dt);
  stepHold(dt);
  for(const k in G.pop){G.pop[k].t-=dt;if(G.pop[k].t<=0)delete G.pop[k];}
  G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.kind==='bubble'||p.kind==='heart'?-10:60)*dt;p.life-=dt;}); G.parts=G.parts.filter(p=>p.life>0);
  G.floats.forEach(f=>{f.y-=26*dt;f.life-=dt;}); G.floats=G.floats.filter(f=>f.life>0);
  G.cleanSum+=cleanliness()*dt; G.cleanN+=dt;
  const cl=cleanliness();
  if(cl<50&&G.t<G.dur){ G.dirtyT+=dt; if(G.dirtyT>=4){G.dirtyT=0;hint('hintDirtyRep');repHit(cl<25?-0.1:-0.05,cl<25?'filthy':'dirty');} } else G.dirtyT=Math.min(G.dirtyT,2);
  if(!G.danger&&G.rep<2.2){G.danger=true;G.alarmT=0;} else if(G.danger&&G.rep>=2.5) G.danger=false;
  if(G.danger){G.alarmT-=dt;if(G.alarmT<=0){G.alarmT=1.6;tone(880,.16,'square',.045);tone(660,.2,'square',.045,.18);}}
  if(G.rep<=1) return endShift(true);
  if(G.t>=G.dur){
    const busy=G.customers.some(c=>c.state!=='leave'&&c.state!=='angry');
    if(!busy||G.t>=G.dur+12) endShift(false);
  }
}

/* speech bubbles are laid out together after all sprites so they never sit on top of each other */
const BUBS=[];
function layoutBubbles(){
  const placed=[], top=36, pad=3;
  BUBS.sort((a,b)=>a.tip-b.tip);
  for(const b of BUBS){
    let x=b.x, y=b.y;
    for(let k=0;k<8;k++){
      const o=placed.find(p=>x<p.x+p.w+pad&&x+b.w+pad>p.x&&y<p.y+p.h+pad&&y+b.h+pad>p.y);
      if(!o) break;
      // a small sideways nudge reads best; otherwise stack the bubble just above the one it hits
      const right=o.x+o.w+pad-x, left=x+b.w+pad-o.x;
      if(Math.min(right,left)<=b.w*.6){ const nx=right<left?x+right:x-left; if(nx>=6&&nx+b.w<=L.W-6){x=nx;continue;} }
      y=o.y-b.h-pad; if(y<top){y=top;x=o.x+o.w+pad+b.w<=L.W-6?o.x+o.w+pad:o.x-b.w-pad;}
    }
    const c=b.c, tx=x-b.x, ty=y-b.y;
    c.bx=c.bx==null?tx:c.bx+(tx-c.bx)*.3; c.by=c.by==null?ty:c.by+(ty-c.by)*.3;
    if(Math.abs(c.bx-tx)<.5)c.bx=tx; if(Math.abs(c.by-ty)<.5)c.by=ty;
    placed.push({x,y,w:b.w,h:b.h});
  }
}

function setText(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
function updateHud(){
  setText('#hDay','Day '+save.day);
  if(G){
    const rn=!!raining(); if(hudCache.rain!==rn){hudCache.rain=rn;$('#hRain').hidden=!rn;}
    setText('#clock',clockText());setText('#hTips',hudMoney(save.coins+G.tips+Math.round(G.sales*.05/100)*100));setText('#hRep','★'+G.rep.toFixed(2));
    const cl=Math.round(cleanliness()); if(hudCache.cl!==cl){hudCache.cl=cl;const el=$('#hClean');el.style.width=cl+'%';el.style.background=cl>60?'var(--teal)':cl>30?'var(--owl)':'var(--warn)';$('#hCleanN').textContent=cl+'%';}
    setProg(Math.min(1,G.t/G.dur)); setLow(G.rep<3); setDanger(!!G.danger&&mode==='play');
  } else {if(hudCache.rain){hudCache.rain=false;$('#hRain').hidden=true;}setText('#clock','22:00');setText('#hTips',hudMoney(save.coins));setText('#hRep','★5.00');setProg(0);setLow(false);setDanger(false);
    if(hudCache.cl!==100){hudCache.cl=100;$('#hClean').style.width='100%';$('#hClean').style.background='var(--teal)';$('#hCleanN').textContent='100%';}}
}
function hudMoney(v){
  if(window.innerWidth<=440&&v>=100000) return save.lang==='ko'?'₩'+(v/10000).toFixed(v<1e6?1:0).replace(/\.0$/,'')+'만':(v>=1e6?'₩'+(v/1e6).toFixed(2)+'M':'₩'+Math.round(v/1000)+'K');
  return won(v);
}
let dangerBarT=0;
function setDanger(on){if(hudCache.danger!==on){hudCache.danger=on;$('#danger').hidden=!on;const bar=$('#dangerBar');clearTimeout(dangerBarT);bar.hidden=!on;if(on){if($('#hint').classList.contains('dock')){hintTimer=0;$('#hint').hidden=true;}dangerBarT=setTimeout(()=>{bar.hidden=true;},3000);}}}
function setProg(p){const v=Math.round(p*200);if(hudCache.prog!==v){hudCache.prog=v;$('#hProg').style.width=(v/2)+'%';}}
function setLow(b){if(hudCache.low!==b){hudCache.low=b;$('#hRep').classList.toggle('low',b);}}
function frame(ts){
  const dt=Math.min(.05,(ts-(lastTs||ts))/1000); lastTs=ts;
  if(mode==='play') update(dt);
  if(mode==='ending'&&E) updateEnding(dt);
  if(hintTimer>0){hintTimer-=dt;if(hintTimer<=0){$('#hint').hidden=true;placeToasts();}}
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  if(mode==='ending'&&E) drawEnding(); else drawStore();
  updateHud();
  requestAnimationFrame(frame);
}

/* ---------- sizing ---------- */
let fitKey='';
let MOB=false;
function fit(){
  const app=$('#app'), ar=app.getBoundingClientRect(), cs=getComputedStyle(app), hud=$('#hud');
  const availW=ar.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const availH=ar.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-hud.offsetHeight-parseFloat(cs.rowGap||8);
  if(mode!=='play'&&mode!=='pause'){ L=(availW/Math.max(1,availH))>=1.1?LAYOUTS.land:LAYOUTS.port; }
  const strip=L===LAYOUTS.port?50:0;
  scale=Math.max(.05,Math.min(availW/L.W,(availH-strip)/L.H));
  dpr=Math.min(2,window.devicePixelRatio||1);
  const cw=Math.floor(L.W*scale), ch=Math.floor(L.H*scale), extra=Math.max(0,Math.floor((availH-ch)/2));
  const compactHud=window.matchMedia('(max-width:840px)').matches;
  MOB=compactHud||L===LAYOUTS.port; document.body.classList.toggle('mob',MOB);
  const key=[cw,ch,extra,dpr,compactHud,strip].join();
  if(key===fitKey) return; fitKey=key;
  hud.style.marginTop=Math.round(Math.max(0,extra-strip/2)*.55)+'px';
  const hn=$('#hint'); hn.classList.toggle('dock',!!strip); hn.style.top=strip?(ch+6)+'px':''; hn.style.maxWidth=strip?(cw-8)+'px':'';
  $('#scrEnd').style.paddingInline=Math.max(12,Math.round((availW-cw)/2)+12)+'px';
  const db=$('#dangerBar'); db.classList.toggle('dock',!!strip); db.style.top=strip?(ch+6)+'px':''; db.style.maxWidth=strip?(cw-8)+'px':'';
  $('#repToast').style.left=Math.max(8,(availW-cw)/2+10)+'px';
  canvas.style.width=cw+'px';hud.style.width=compactHud?cw+'px':'';canvas.style.height=ch+'px';
  canvas.width=Math.floor(L.W*scale*dpr);canvas.height=Math.floor(L.H*scale*dpr);
}
window.addEventListener('resize',fit);
if(window.ResizeObserver) new ResizeObserver(fit).observe($('#app'));

/* ---------- input ---------- */
function toLogical(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio(); if(mode!=='play') return;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  const p=toLogical(e); ptr={x:p.x,y:p.y,mode:'none',touch:e.pointerType!=='mouse'};
  if(G.cat&&!G.cat.fed&&G.cat.state!=='out'&&dist(p,G.cat)<44){feedCat();return;}
  const tr=G.seats.find(st=>st.trash&&dist(p,st.cup)<30); if(tr){clearTrash(tr);ptr.mode='tap';return;}
  const f=G.queue[0];
  if(save.up.hoppang&&inRect(p,steamerRect(),6)){giveBun();ptr.mode='tap';return;}
  if(inRect(p,L.counter,12)||(f&&f.state==='counter'&&dist(p,f)<38)){scan();ptr.mode='tap';return;}
  const s=L.shelves.find(s=>inRect(p,s,10));
  if(s){if(startHold(s))ptr.mode='hold';ptr.shelf=s;return;}
  ptr.mode='scrub'; canvas.style.cursor='none'; scrubAt(p.x,p.y,4);
});
function hoverCursor(p){
  if(mode!=='play'){canvas.style.cursor='default';return;}
  const f=G.queue[0];
  let c='crosshair';
  if(G.cat&&!G.cat.fed&&G.cat.state!=='out'&&dist(p,G.cat)<44) c='pointer';
  else if(G.seats.some(st=>st.trash&&dist(p,st.cup)<30)) c='pointer';
  else if(inRect(p,L.counter,12)||(f&&f.state==='counter'&&dist(p,f)<38)) c='pointer';
  else if(L.shelves.some(s=>inRect(p,s,10))) c='grab';
  canvas.style.cursor=c;
}
canvas.addEventListener('pointermove',e=>{
  if(!ptr&&e.pointerType==='mouse'&&G){hoverCursor(toLogical(e));return;}
  if(!ptr||mode!=='play') return;
  const p=toLogical(e);
  if(ptr.mode==='scrub'){
    const d=Math.hypot(p.x-ptr.x,p.y-ptr.y), steps=Math.max(1,Math.ceil(d/6));
    for(let i=1;i<=steps;i++) scrubAt(ptr.x+(p.x-ptr.x)*i/steps,ptr.y+(p.y-ptr.y)*i/steps,d/steps);
  } else if(ptr.mode==='hold'&&!inRect(p,ptr.shelf,24)){G.holding=null;ptr.mode='none';}
  if(ptr.mode==='scrub') ptr.tilt=(ptr.tilt||0)*.6+Math.max(-1,Math.min(1,(p.x-ptr.x)*.06))*.4;
  ptr.x=p.x;ptr.y=p.y;
});
function endPtr(){ if(ptr&&ptr.mode==='scrub') canvas.style.cursor='crosshair'; if(ptr&&ptr.mode==='hold'&&G) G.holding=null; ptr=null; }
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
window.addEventListener('keydown',e=>{
  if(mode==='play'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();ensureAudio();scan();}
  else if(mode==='play'&&e.code==='KeyB'&&save.up.hoppang){ensureAudio();giveBun();}
  else if(e.code==='KeyP'){mode==='play'?pauseGame():mode==='pause'&&resumeGame();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pauseGame();if(AC){if(document.hidden)AC.suspend();else AC.resume();}});

/* ---------- screens ---------- */
const screens=['#scrTitle','#scrPause','#scrSum','#scrShop','#scrEnd'];
function show(id){screens.forEach(s=>$(s).hidden=s!==id);}
function applyI18n(){
  document.documentElement.lang=save.lang; document.title=t('gameName');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $('#bStart').textContent=t('start').replace('{d}',save.day);
  $('#tCoins').textContent=won(save.coins);
  const goal=UPG.mystore.cost[0], g=$('#tGoal');
  if(save.up.mystore){ g.className='goalrow owner'; $('#tGoalTxt').textContent='★ '+t('ownerBadge'); $('#tGoalAmt').textContent=''; $('#tGoalBar').style.width='100%'; }
  else if(save.coins>=goal){ g.className='goalrow ready'; $('#tGoalTxt').textContent=t('goalReady'); $('#tGoalAmt').textContent=''; $('#tGoalBar').style.width='100%'; }
  else { g.className='goalrow'; $('#tGoalTxt').textContent=t('goalLeft'); $('#tGoalAmt').textContent=won(goal-save.coins); $('#tGoalBar').style.width=Math.round(save.coins/goal*100)+'%'; }
}
function toTitle(){CG.stop();$('#hud').style.visibility='';mode='title';Music.setRain(false);Music.setLevel(.5);G=null;fitKey='';fit();applyI18n();show('#scrTitle');}
function startShift(){ensureAudio();Music.setLevel(.5);show(null);fitKey='';fit();newShift();mode='play';lastTs=0;CG.start();}
function pauseGame(){if(mode!=='play')return;mode='pause';CG.stop();endPtr();show('#scrPause');Music.setLevel(.18);}
function resumeGame(){mode='play';lastTs=0;CG.start();show(null);Music.setLevel(.5);}
let lastSum=null;
function endShift(early){
  mode='summary'; CG.stop(); endPtr(); Music.setRain(false);
  const wage=Math.round((20000+(save.day-1)*2000)*(early?.5:1));
  const commission=Math.round(G.sales*0.05/100)*100;
  const starBonus=G.rep>=4.5?10000:G.rep>=3.5?5000:0;
  const cleanAvg=G.cleanN?G.cleanSum/G.cleanN:100;
  const cleanBonus=cleanAvg>=80?3000:0;
  const albaWage=[0,8000,12000][save.up.alba]||0;
  const total=wage+commission+G.tips+starBonus+cleanBonus-albaWage;
  lastSum={wage,commission,tips:G.tips,starBonus,cleanBonus,albaWage,total,doubled:false};
  save.coins+=total; if(!early) save.day+=1;
  save.stats.days++; save.stats.served+=G.served; save.stats.earned+=Math.max(0,total); persist();
  $('#sTitle').textContent=early?t('sumEarly'):t('sumTitle');
  renderSumLines();
  $('#sServed').textContent=G.served; $('#sLost').textContent=G.lost;
  const why=Object.entries(G.repLog).sort((a,b)=>a[1]-b[1]);
  $('#sRep').innerHTML=(early?`<p class="early">${t('earlyWhy')}</p>`:'')+`<h3>${t('repWhy')}</h3>`+(why.length?why.map(([k,v])=>`<div><span>${t('r_'+k)}</span><b>★−${Math.abs(v).toFixed(2)}</b></div>`).join(''):`<p>${t('repNone')}</p>`);
  $('#repToast').innerHTML='';
  const ad=$('#bAd'), canAd=Ads.available()&&G.tips>0; ad.hidden=!canAd; ad.disabled=false;
  ad.innerHTML=`<span class="vid" aria-hidden="true">▶</span>${t('adDouble')} <b>+${won(G.tips)}</b>`;
  show('#scrSum');
}
function renderSumLines(){
  const s=lastSum, rows=[['wage',s.wage],['commission',s.commission],['tips',s.tips*(s.doubled?2:1)],['starBonus',s.starBonus],['cleanBonus',s.cleanBonus]].concat(s.albaWage?[['albaWage',-s.albaWage]]:[]);
  $('#sLines').innerHTML=rows.map(([k,v])=>`<div><dt>${t(k)}</dt><dd${v<0?' class="neg"':''}>${v<0?'−'+won(-v):won(v)}</dd></div>`).join('')+
    `<div class="total"><dt>${t('total')}</dt><dd>${won(s.total+(s.doubled?s.tips:0))}</dd></div>`;
}
/* Ads: 'off' for a CrazyGames Basic Launch (ads are disabled there, so no reward button is shown).
   Set to 'sdk' for Full Launch to use the CrazyGames SDK rewarded ad. */
const AD_MODE='off';
const Ads={
  available(){ return AD_MODE==='sdk'&&!!(window.CrazyGames&&window.CrazyGames.SDK&&window.CrazyGames.SDK.ad); },
  rewarded(onReward,onFail){
    if(!this.available()) return onFail();
    const done=()=>{adMuted=false;Music.sync();};
    window.CrazyGames.SDK.ad.requestAd('rewarded',{
      adStarted:()=>{adMuted=true;if(Music.bus)Music.bus.gain.setTargetAtTime(0,AC.currentTime,.05);},
      adFinished:()=>{done();onReward();},
      adError:()=>{done();onFail();}
    });
  }
};
function playAd(){
  if(!lastSum||lastSum.doubled) return;
  const b=$('#bAd'); b.disabled=true;
  Ads.rewarded(()=>{
    lastSum.doubled=true; save.coins+=lastSum.tips; save.stats.earned+=lastSum.tips; persist(); renderSumLines();
    b.textContent=t('adDone'); sfx.coin();
  },()=>{ b.textContent=t('adFail'); });
}

function fanfare(){if(!AC)return;[[523,0],[659,.14],[784,.28],[1047,.42],[784,.62],[1047,.76]].forEach(([f,d])=>{tone(f,.35,'triangle',.07,d);tone(f/2,.35,'sine',.04,d);});}
function updateEnding(dt){
  E.t+=dt;
  if(!E.cut&&E.t>1.8){E.cut=true;fanfare();}
  if(E.cut&&E.parts.length<260){
    const n=E.t<2.6?14:2;
    for(let i=0;i<n;i++) E.parts.push({x:rand(0,L.W),y:-10,vx:rand(-30,30),vy:rand(60,150),r:Math.random()*6,vr:rand(-6,6),w:rand(5,9),h:rand(3,5),c:pick(['#ffb347','#43d1b5','#ff6f91','#4f7cff','#ffd84a','#ffffff'])});
  }
  E.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.vx+=Math.sin(E.t*3+p.y*.02)*8*dt;});
  E.parts=E.parts.filter(p=>p.y<L.H+20);
}
function drawEnding(){
  const W=L.W,H=L.H,now=performance.now()/1000,land=W>H,gy=land?H*.8:H*.5,CX=land?W*.34:W/2;
  // morning sky

  ctx.save();ctx.shadowColor='rgba(255,220,150,.9)';ctx.shadowBlur=40;ctx.fillStyle='#fff3c9';ctx.beginPath();ctx.arc(W*.82,H*.16,Math.min(W,H)*.07,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.75)';[[.18,.12,1],[.5,.07,.8],[.68,.24,.7]].forEach(([x,y,k],i)=>{const cx=((x*W+now*10*(i+1))%(W+160))-80;ctx.beginPath();ctx.ellipse(cx,y*H,46*k,14*k,0,0,7);ctx.ellipse(cx+28*k,y*H-8*k,30*k,14*k,0,0,7);ctx.fill();});

  ctx.fillStyle='#4a4f5a';ctx.fillRect(0,H-H*.06,W,H*.06);ctx.fillStyle='#f2f4f7';for(let x=0;x<W;x+=70)ctx.fillRect(x+10,H-H*.035,34,3);

  // people: owner in front of the door, clerk, cat, first customers arriving
  const fy=gy+(land?H*.07:H*.035);
  const drawP=(v,x,y,s,expr,frame)=>{shadow(x,y+15*s,14*s,5*s,.25);ctx.drawImage(charSprite(v,frame||0,expr),x-20*s,y-38*s,40*s,53.3*s);};
  const sc=land?Math.max(1.1,Math.min(1.6,W/600)):1.25;
  drawP(E.owner,CX-dw*.25,fy,sc,'happy',(E.cut&&Math.floor(now*3)%2)?1:0);
  ctx.font='700 11px "IBM Plex Sans KR",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const ot=t('ownerTag'),ow=ctx.measureText(ot).width+14;
  rrp(ctx,CX-dw*.25-ow/2,fy+18*sc,ow,15,7);ctx.fillStyle='#ffb347';ctx.fill();ctx.fillStyle='#2a1a04';ctx.fillText(ot,CX-dw*.25,fy+18*sc+8);
  drawP(E.alba,CX+dw*.45,fy+6,sc*.95,'happy');
  ctx.drawImage(CAT[Math.floor(now*3)%2],CX-dw*.75-20*sc,fy-6*sc,40*sc,40*sc);
  E.cust.forEach((c,i)=>{
    const base=(land?CX+bw*.5+20:W*.92)-i*40*sc, x=E.cut?base-Math.min(1,Math.max(0,(E.t-2.2-i*.3)*.6))*60:base;
    const walking=E.cut&&E.t>2.2+i*.3&&E.t<4+i*.3;if(walking)c.step+=.15;
    drawP(c.v,x,fy+16,sc*.9,'happy',walking?Math.floor(c.step)%2:0);
  });
  // confetti
  E.parts.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
}
$('#bEndGo').addEventListener('click',()=>{E=null;toTitle();});
$('#bEndReset').addEventListener('click',()=>{
  const b=$('#bEndReset');
  if(!b.dataset.sure){b.dataset.sure='1';b.textContent=t('endRestartSure');return;}
  const keep={lang:save.lang,muted:save.muted};
  Object.assign(save,{coins:0,day:1,up:blankUp(),hints:{},ended:false,stats:{days:0,served:0,earned:0}},keep);persist();
  E=null;toTitle();
});
let shopReturn='#scrTitle';
function openShop(from){shopReturn=from;renderShop();show('#scrShop');}
function renderShop(){
  $('#shCoins').textContent=won(save.coins);
  $('#upList').innerHTML=UPGROUPS.map(([gk,keys])=>`<h3 class="grp">${t(gk)}</h3>`+keys.map(k=>{
    const lv=save.up[k], u=UPG[k], maxed=lv>=u.max, cost=maxed?0:u.cost[lv];
    const pips=Array.from({length:u.max},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('');
    if(k==='mystore'){
      const p=Math.min(1,save.coins/cost||0);
      return `<div class="up goal"><h3>${t('up_'+k)}</h3><p>${t('upd_'+k)}</p><div class="gbar"><i style="width:${maxed?100:Math.round(p*100)}%"></i></div>
      <button class="btn ${maxed?'ghost':'primary'}" data-buy="${k}" ${maxed||save.coins<cost?'disabled':''}>${maxed?t('opened'):won(cost)}</button></div>`;
    }
    return `<div class="up"><h3>${t('up_'+k)}</h3><p>${t('upd_'+k)}</p><div class="pips">${pips}</div>
      <button class="btn ${maxed?'ghost':'primary'}" data-buy="${k}" ${maxed||save.coins<cost?'disabled':''}>${maxed?t('max'):won(cost)}</button></div>`;
  }).join('')).join('');
}
$('#upList').addEventListener('click',e=>{
  const b=e.target.closest('[data-buy]'); if(!b) return; ensureAudio();
  const k=b.dataset.buy, lv=save.up[k], u=UPG[k]; if(lv>=u.max) return;
  const cost=u.cost[lv]; if(save.coins<cost) return;
  save.coins-=cost; save.up[k]++; persist(); sfx.stock(); renderShop();
  if(k==='mystore') startEnding();
});
$('#bStart').addEventListener('click',startShift);
$('#bNext').addEventListener('click',startShift);
$('#bShop1').addEventListener('click',()=>openShop('#scrTitle'));
$('#bShop2').addEventListener('click',()=>openShop('#scrSum'));
$('#bBack').addEventListener('click',()=>{ if(shopReturn==='#scrSum') show('#scrSum'); else toTitle(); });
$('#bLang').addEventListener('click',()=>{save.lang=save.lang==='ko'?'en':'ko';persist();applyI18n();});
$('#bPause').addEventListener('click',()=>{mode==='play'?pauseGame():mode==='pause'&&resumeGame();});
$('#bResume').addEventListener('click',resumeGame);
$('#bQuit').addEventListener('click',toTitle);
$('#bAd').addEventListener('click',playAd);
function syncSound(){$('#bSound').textContent=save.muted?'♪̸':'♪';$('#bSound').setAttribute('aria-pressed',String(!save.muted));}
$('#bSound').addEventListener('click',()=>{save.muted=!save.muted;persist();syncSound();ensureAudio();Music.sync();});
document.addEventListener('pointerdown',()=>ensureAudio(),{once:true});

buildProducts(); buildCat(); buildRobot();
syncSound(); fit(); applyI18n(); show('#scrTitle');
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{BG=null;});
requestAnimationFrame(frame);
(async()=>{
  const S=CG.sdk(); if(!S) return;
  try{ await Promise.race([S.init(),new Promise((_,r)=>setTimeout(()=>r(new Error('sdk timeout')),8000))]); }catch(e){ return; }
  if(S.environment!=='crazygames'&&S.environment!=='local') return;
  CG.on=true;
  try{
    const raw=S.data.getItem('owlmart.v1');
    if(raw){ if(mode==='title'){ const keepLang=save.lang; mergeSave(save,JSON.parse(raw)); if(!save.lang) save.lang=keepLang; } }
    else if(hadLocalSave){ S.data.setItem('owlmart.v1',JSON.stringify(save)); }
    else { const loc=S.user&&S.user.systemInfo&&S.user.systemInfo.locale; if(loc){ save.lang=/^ko/i.test(loc)?'ko':'en'; } }
    try{localStorage.setItem('owlmart.v1',JSON.stringify(save));}catch(e){}
  }catch(e){}
  try{ CG.mute=!!(S.game.settings&&S.game.settings.muteAudio);
       S.game.addSettingsChangeListener(n=>{CG.mute=!!(n&&n.muteAudio); if(AC) Music.sync();}); }catch(e){}
  if(mode==='title'){ applyI18n(); syncSound(); }
  if(AC) Music.sync();
  if(mode==='play') CG.start();
})();
})();
</script>
